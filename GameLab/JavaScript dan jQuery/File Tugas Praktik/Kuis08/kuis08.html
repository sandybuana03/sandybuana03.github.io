<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kuis 08 - jQuery Effects</title>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    .box {
      width: 200px;
      height: 100px;
      background: #0d6efd;
      color: #fff;
      display: none;
      padding: 15px;
      margin-bottom: 15px;
    }
    .panel {
      width: 200px;
      background: #198754;
      color: white;
      padding: 15px;
      display: none;
      margin-bottom: 15px;
    }
    img {
      width: 150px;
      display: none;
      margin-bottom: 15px;
    }
    button {
      margin: 5px 0;
      display: block;
    }
  </style>
</head>
<body>

  <h2>Kuis #8 - jQuery Effects</h2>

  <button id="btnFadeIn">Fade In Box</button>
  <button id="btnFadeOut">Fade Out Box</button>
  <button id="btnFadeToggle">Fade Toggle Box</button>
  <button id="btnFadeTo">Fade To (Opacity)</button>

  <div class="box">Ini elemen BOX</div>

  <button id="btnSlideDown">Slide Down Panel</button>
  <button id="btnSlideUp">Slide Up Panel</button>
  <button id="btnSlideToggle">Slide Toggle Panel</button>

  <div class="panel">Ini elemen PANEL</div>

  <button id="btnShowImg">Show Image</button>
  <button id="btnHideImg">Hide Image</button>
  <button id="btnToggleImg">Toggle Image</button>

  <img src="https://picsum.photos/1600/800?random=5" alt="gambar">

  <script src="kuis08.js"></script>
</body>
</html>
