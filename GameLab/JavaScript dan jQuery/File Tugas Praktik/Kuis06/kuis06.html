<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kuis 06 - jQuery Selector</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- File JS -->
    <script src="kuis06.js"></script>
</head>
<body>

    <h2>Kuis 06 - Hide Element dengan jQuery</h2>

    <!-- Elemen tanpa class -->
    <p id="noClass">Ini elemen tanpa class</p>

    <!-- Elemen dengan class -->
    <p class="targetClass">Ini elemen dengan class</p>

    <!-- Elemen dengan atribut href -->
    <a href="https://gamelab.id" target="_blank">Ini elemen dengan atribut href</a>

    <hr>

    <!-- Tombol -->
    <button onclick="hideEl()">Sembunyikan Elemen Tanpa Class</button>
    <button onclick="hideClass()">Sembunyikan Elemen dengan Class</button>
    <button onclick="hideAttr()">Sembunyikan Elemen dengan Atribut href</button>

</body>
</html>
