<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kuis 10 - AJAX Cuaca</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            min-height: 100vh;
        }

        .weather-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .loading {
            font-size: 18px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center fw-bold mb-3 text-white">
        ☁️ Kuis 10 - Cek Cuaca
    </h1>
    <p class="text-center text-white mb-4">
        Contoh AJAX jQuery menggunakan API Cuaca Gratis
    </p>

    <div class="text-center mb-4">
        <button id="loadWeather" class="btn btn-lg btn-dark">
            <i class="bi bi-cloud-sun"></i> Lihat Cuaca Hari Ini
        </button>
    </div>

    <div id="result" class="row justify-content-center">
        <!-- Data cuaca muncul di sini -->
    </div>
</div>

<script src="kuis10.js"></script>
</body>
</html>
