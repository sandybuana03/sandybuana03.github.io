<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Buana Weather Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-4">
  <div class="d-flex justify-content-between mb-3">
    <h3>🌤️ Buana Weather Indonesia</h3>
    <button id="darkMode" class="btn btn-outline-secondary">🌙</button>
  </div>

  <!-- SEARCH -->
  <div class="position-relative mb-3">
    <input id="search" class="form-control form-control-lg" placeholder="Cari kota (contoh: Kota Tegal)">
    <div id="suggest" class="autocomplete"></div>
  </div>

  <div class="d-flex gap-2 mb-3">
    <button id="searchBtn" class="btn btn-primary w-100">🔍 Cari</button>
    <!-- <button id="saveFav" class="btn btn-warning">⭐</button> -->
  </div>

  <!-- WEATHER -->
  <div class="card-box text-center mb-4" id="weather" style="display:none">
    <h4 id="city"></h4>
    <img id="icon" width="80">
    <h1 id="temp"></h1>
    <p id="desc"></p>
  </div>

  <!-- MAP -->
  <div class="card-box mb-4">
    <h5>🗺️ Peta Lokasi</h5>
    <div id="map"></div>
  </div>

  <!-- CHART -->
  <div class="card-box">
    <h5>📈 Grafik Suhu 7 Hari</h5>
    <canvas id="chart"></canvas>
  </div>

  <!-- FAVORITES -->
  <!-- <div class="card-box mt-4">
    <h5>⭐ Kota Favorit</h5>
    <ul id="favList"></ul>
  </div> -->
</div>

<script src="app.js"></script>

</body>
</html>
