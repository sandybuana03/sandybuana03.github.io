<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kuis 07 - jQuery Events</title>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    button {
      margin: 5px 0;
    }
    .box {
      width: 200px;
      height: 100px;
      background-color: lightblue;
      margin-top: 10px;
      line-height: 100px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Kuis #7 - jQuery Events</h2>

  <p id="text">Klik teks ini</p>

  <button id="btnClick">Klik</button>
  <button id="btnDbl">Double Klik</button>

  <input type="text" id="inputText" placeholder="Ketik sesuatu">
  <br><br>

  <textarea id="areaText" placeholder="Ketik di textarea"></textarea>
  <br><br>

  <select id="selectOption">
    <option value="">-- Pilih --</option>
    <option value="HTML">HTML</option>
    <option value="CSS">CSS</option>
    <option value="JavaScript">JavaScript</option>
  </select>

  <div class="box" id="box">Hover Me</div>

  <script src="kuis07.js"></script>
</body>
</html>
