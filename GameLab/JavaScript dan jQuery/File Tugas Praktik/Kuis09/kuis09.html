<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kuis 09 - jQuery DOM Method</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .box {
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ccc;
        }
        .highlight { background: #ffe082; }
        .danger { color: red; }
        .active { font-weight: bold; }
        .completed { text-decoration: line-through; }

        .avatar {
              width: 100px;
              height: auto;
              border-radius: 8px; /* opsional biar agak rounded */
        }
    </style>
</head>
<body>

<h2>Kuis 09 – jQuery DOM Method</h2>

<!-- PARAGRAPH -->
<p class="box welcome-text">Selamat Datang</p>
<p class="box info-text">Informasi Awal</p>

<!-- INPUT -->
<input type="text" class="box focus" value="Input Teks">
<br><br>

<!-- TEXTAREA -->
<textarea class="box highlight" title="catatan">Isi Catatan</textarea>

<!-- IMAGE -->
<img src="https://picsum.photos/1600/800?random=2" class="box avatar" alt="gambar">

<!-- LINK -->
<a href="https://smkalirsyadtegal.sch.id/" class="box link">Kunjungi Website</a>

<!-- ALERT -->
<div class="box alert alert-info">Pesan Sistem</div>

<!-- BUTTON -->
<hr>
<button id="btnAdd">Tambah Class</button>
<button id="btnRemove">Hapus Class</button>
<button id="btnToggle">Toggle Class</button>
<button id="btnAttr">Ubah Atribut</button>
<button id="btnText">Ubah Teks</button>
<button id="btnHtml">Ubah HTML</button>
<button id="btnRemoveAttr">Hapus Atribut</button>
<button id="btnRemoveEl">Hapus Elemen</button>

<script src="kuis09.js"></script>
</body>
</html>
