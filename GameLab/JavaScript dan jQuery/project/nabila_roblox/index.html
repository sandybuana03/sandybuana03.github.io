<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Player Finder</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <div class="overlay"></div>

  <div class="container">

    <h1>🎮 Roblox Player Finder</h1>
    <p class="subtitle">
      Cari data player Roblox dengan AJAX & jQuery
    </p>

    <div class="search-box">
      <input type="text" id="username" placeholder="Masukkan Username Roblox">
      <button id="searchBtn">Cari</button>
    </div>

    <div class="history-box">
      <h3>Riwayat Pencarian</h3>
      <ul id="historyList"></ul>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p>Sedang mencari player...</p>
    </div>

    <div id="result"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
