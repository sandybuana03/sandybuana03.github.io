<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Meme Generator 😂</h1>

        <button id="loadMeme">Ambil Meme Random</button>

        <br><br>

        <input type="text" id="topText" placeholder="Teks Atas">
        <input type="text" id="bottomText" placeholder="Teks Bawah">

        <br><br>

        <select id="colorText">
            <option value="white">Putih</option>
            <option value="yellow">Kuning</option>
            <option value="red">Merah</option>
        </select>

        <br><br>

        <div class="meme-box">
            <img id="memeImage" src="" alt="Meme">

            <h2 id="textTop"></h2>
            <h2 id="textBottom"></h2>
        </div>

        <br>

        <button id="generateText">Generate Text</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
