<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Info Cuaca Praktis</title>
    <link rel="stylesheet" href="style.css">
    <!-- Memanggil jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Cek Cuaca Kota</h1>
        <p>Masukkan nama kota dunia (contoh: Jakarta, Tokyo, London)</p>
        
        <div class="search-box">
            <input type="text" id="input-kota" placeholder="Ketik nama kota...">
            <button id="btn-cari">Cari Cuaca</button>
        </div>

        <!-- Wadah untuk menampilkan hasil dari DOM & AJAX -->
        <div id="hasil-cuaca" class="card hidden">
            <h2 id="nama-kota">-</h2>
            <h3 id="temperatur">-</h3>
            <p>Kondisi: <span id="kondisi">-</span></p>
            
            <hr>
            
            <!-- Tempat blok kondisional menampilkan rekomendasi -->
            <div class="rekomendasi-box">
                <h4>Rekomendasi Aktivitas:</h4>
                <p id="saran-aktivitas">-</p>
            </div>
        </div>
        
        <div id="error-pesan" class="error hidden">Kota tidak ditemukan atau terjadi kesalahan.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
