<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi PC & Monitor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan CDN jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>🖥️ PC & Monitor Recommendation Picker</h1>
        <p class="subtitle">Temukan racikan PC dan monitor terbaik sesuai kebutuhan dan budgetmu.</p>
        
        <hr>

        <!-- Form Input -->
        <div class="form-section">
            <div class="form-group">
                <label for="budget">Budget Anda (Rupiah):</label>
                <input type="number" id="budget" placeholder="Contoh: 15000000" min="0">
            </div>

            <div class="form-group">
                <label for="kebutuhan">Kebutuhan Utama:</label>
                <select id="kebutuhan">
                    <option value="gaming">Gaming & Editing Berat</option>
                    <option value="kerja">Kerja Kantoran / Sekolah</option>
                </select>
            </div>

            <!-- JQuery Event akan dipicu saat tombol ini diklik -->
            <button id="btn-rekomendasi">Dapatkan Rekomendasi</button>
        </div>

        <!-- Tempat Menampilkan Hasil (DOM Manipulation) -->
        <div id="hasil-rekomendasi" class="result-section hidden">
            <h2>Hasil Rekomendasi Untuk Anda</h2>
            <div class="card">
                <h3>Spesifikasi PC</h3>
                <p id="spek-pc">-</p>
            </div>
            <div class="card">
                <h3>Rekomendasi Monitor</h3>
                <p id="spek-monitor">-</p>
            </div>
            <div class="price-box">
                <p>Total Estimasi Harga: <strong id="total-harga">Rp 0</strong></p>
                <!-- Tombol AJAX untuk Konversi Mata Uang -->
                <button id="btn-konversi">Konversi ke USD ($)</button>
                <p id="harga-usd" class="hidden"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
