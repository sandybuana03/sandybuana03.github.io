<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Quote Generator - Tugas Akhir</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Quote Inspiratif Hari Ini</h1>
        <p class="subtitle">Tugas Akhir Pemrograman Web</p>
        
        <div class="quote-box">
            <p id="quote-text">"Klik tombol di bawah untuk memuat quotes menarik."</p>
            <h3 id="quote-author">- Kreator</h3>
        </div>

        <div class="filter-section">
            <label for="category-select">Pilih Kategori Panjang Kata:</label>
            <select id="category-select">
                <option value="all">Semua Ukuran</option>
                <option value="short">Pendek ( < 50 karakter )</option>
                <option value="long">Panjang ( >= 50 karakter )</option>
            </select>
        </div>

        <div class="button-group">
            <button id="btn-get-quote">Ambil Quote Baru</button>
            <button id="btn-clear" class="btn-secondary">Reset</button>
        </div>
        
        <p id="status-log">Status: Siap.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
