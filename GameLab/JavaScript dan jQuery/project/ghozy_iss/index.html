<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelacak ISS Sederhana</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b1d3a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #162c4e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #007a80;
        }
        .data-panel {
            margin-top: 25px;
            padding: 15px;
            background: #1f3d68;
            border-radius: 8px;
            text-align: left;
        }
        .status {
            font-weight: bold;
            color: #ffbe0b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛰️ Pelacak Koordinat ISS</h2>
        <p>Klik tombol di bawah untuk mendapatkan lokasi terkini Stasiun Luar Angkasa Internasional.</p>
        
        <button id="btn-track">Lacak Lokasi ISS</button>

        <div class="data-panel">
            <p><strong>Garis Lintang (Latitude):</strong> <span id="lat">-</span></p>
            <p><strong>Garis Bujur (Longitude):</strong> <span id="lon">-</span></p>
            <p><strong>Kecepatan:</strong> <span id="speed">-</span></p>
            <p><strong>Status Belahan Bumi:</strong> <span id="hemisphere" class="status">-</span></p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            
            // 1. JQUERY EVENTS
            // Memicu fungsi ketika tombol dengan ID 'btn-track' diklik
            $('#btn-track').on('click', function() {
                ambilDataISS();
            });

            // 2. FUNGSI
            // Fungsi utama untuk melakukan request data
            function ambilDataISS() {
                // Mengubah teks tombol saat loading menggunakan jQuery + DOM
                $('#btn-track').text('Memuat data...');

                // 3. AJAX
                // Melakukan request ke API publik wheretheiss.at
                $.ajax({
                    url: "https://api.wheretheiss.at/v1/satellites/25544",
                    type: "GET",
                    success: function(response) {
                        // 4. VARIABEL
                        // Menyimpan data hasil respon API ke dalam variabel
                        let latitude = response.latitude;
                        let longitude = response.longitude;
                        let kecepatan = response.velocity.toFixed(2) + " km/h";
                        let pesanBelahanBumi = "";

                        // 5. BLOK KONDISIONAL
                        // Mengecek posisi ISS berdasarkan garis lintang (Latitude)
                        if (latitude > 0) {
                            pesanBelahanBumi = "ISS sedang berada di Belahan Bumi Utara 🌍";
                        } else if (latitude < 0) {
                            pesanBelahanBumi = "ISS sedang berada di Belahan Bumi Selatan 🌍";
                        } else {
                            pesanBelahanBumi = "ISS tepat berada di atas Garis Khatulistiwa 🧭";
                        }

                        // 6. JQUERY + DOM
                        // Memasukkan data variabel ke dalam elemen HTML
                        $('#lat').text(latitude.toFixed(4));
                        $('#lon').text(longitude.toFixed(4));
                        $('#speed').text(kecepatan);
                        $('#hemisphere').text(pesanBelahanBumi);
                        
                        // Mengembalikan teks tombol
                        $('#btn-track').text('Lacak Lokasi ISS');
                    },
                    error: function(error) {
                        alert("Gagal mengambil data ISS. Silakan coba lagi nanti.");
                        $('#btn-track').text('Lacak Lokasi ISS');
                    }
                });
            }
        });
    </script>

</body>
</html>
