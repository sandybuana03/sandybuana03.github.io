<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="card">
        <h2>🌍 Global Converter</h2>
        <p>Konversi Mata Uang Seluruh Dunia</p>
        <hr>

        <div class="input-group">
            <label>Jumlah Uang:</label>
            <input type="number" id="amountInput" placeholder="Contoh: 100" value="1">
        </div>

        <div class="input-group">
            <label>Dari:</label>
            <select id="baseCurrency">
                <option value="USD">USD - Amerika Serikat</option>
                <option value="IDR" selected>IDR - Indonesia</option>
                <option value="SEK">SEK - Swedia</option>
                <option value="EUR">EUR - Eropa</option>
                <option value="JPY">JPY - Jepang</option>
                <option value="SAR">SAR - Arab Saudi</option>
            </select>
        </div>

        <div class="input-group">
            <label>Ke:</label>
            <select id="targetCurrency">
                <option value="SEK" selected>SEK - Swedia</option>
                <option value="USD">USD - Amerika Serikat</option>
                <option value="IDR">IDR - Indonesia</option>
                <option value="EUR">EUR - Eropa</option>
                <option value="JPY">JPY - Jepang</option>
                <option value="MYR">MYR - Malaysia</option>
            </select>
        </div>

        <button id="btnConvert">Konversi Sekarang</button>

        <div id="resultBox" style="display:none;">
            <p id="convertDetail"></p>
            <h1 id="finalResult"></h1>
            <p id="statusMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
