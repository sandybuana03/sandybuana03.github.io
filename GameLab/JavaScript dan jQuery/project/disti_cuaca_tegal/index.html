<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cuaca Tegal - Tugas Akhir</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="greeting">Memuat sapaan...</h1>
            <p id="app-title">Aplikasi Pemantau Cuaca Tegal</p>
        </header>

        <main>
            <div class="card">
                <h3>Kondisi Real-time: Kota Tegal</h3>

                <div id="weather-loader">
                    <p>Sedang mengambil data dari satelit...</p>
                </div>

                <div id="weather-content" style="display:none;">
                    <div class="temp-display">
                        <span id="temp">--</span><span class="unit">°C</span>
                    </div>
                    <p id="description">Status: --</p>
                </div>

                <button id="btn-refresh">Cek Cuaca Terbaru</button>
            </div>

            <div class="user-section">
                <p>Ubah nama panggilan:</p>
                <div class="input-group">
                    <input type="text" id="user-name" placeholder="Ketik namamu...">
                    <button id="btn-save">Simpan</button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 - Tugas Akhir Dasar Pemrograman Web</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
