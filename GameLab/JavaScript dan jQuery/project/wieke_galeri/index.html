<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Gallery App</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>


    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                📸 Random Gallery
            </a>

            <div class="d-flex gap-2">
                <button class="btn btn-warning" id="darkModeBtn">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>

                <button class="btn btn-danger position-relative"
                        data-bs-toggle="modal"
                        data-bs-target="#favoriteModal">

                    <i class="bi bi-heart-fill"></i>

                    <span id="favoriteCount"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-light text-dark">
                        0
                    </span>
                </button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-section">
        <div class="container text-center">

            <h1 class="display-5 fw-bold mb-3">
                Galeri Foto Random
            </h1>

            <p class="lead mb-4">
                Wieke Nurbaeti XI RPL
            </p>

            <!-- <div class="row justify-content-center g-2" id="inputSection">

                <div class="col-md-4" data-aos="zoom-in">
                    <input type="number"
                           id="photoLimit"
                           class="form-control form-control-lg"
                           value="6"
                           min="1"
                           max="20">
                </div>

                <div class="col-md-4" data-aos="zoom-in">
                    <button class="btn btn-primary btn-lg w-100"
                            id="loadBtn">
                        <i class="bi bi-images"></i>
                        Load Gallery
                    </button>
                </div>

            </div> -->
        </div>
    </section>

    <!-- LOADING -->
    <div id="loading">
        <div class="spinner-border text-primary"
             role="status">
        </div>

        <p class="mt-3">
            Loading awesome photos...
        </p>
    </div>

    <!-- GALLERY -->
    <section class="container py-4">

        <div class="row g-4" id="gallery">

        </div>

    </section>

    <!-- IMAGE MODAL -->
    <div class="modal fade"
         id="imageModal"
         tabindex="-1">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content bg-dark">

                <div class="modal-body text-center">

                    <img id="modalImage"
                         class="img-fluid rounded">

                </div>

            </div>

        </div>

    </div>

    <!-- FAVORITE MODAL -->
    <div class="modal fade"
         id="favoriteModal"
         tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        ❤️ Favorite Photos
                    </h5>

                    <button class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="row g-3"
                         id="favoriteGallery">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="script.js"></script>
    <script>
    AOS.init();
    </script>

</body>
</html>
