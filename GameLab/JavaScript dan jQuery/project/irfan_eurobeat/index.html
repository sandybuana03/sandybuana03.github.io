<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>90 EUROBEAT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scanline"></div>
<div class="bg-grid"></div>

<div class="container py-5">

  <!-- HEADER -->
  <div class="text-center mb-5 header-block">
    <div class="logo-badge mb-2">&#9654; NOW PLAYING</div>
    <h1 class="main-title">90 EUROBEAT</h1>
    <p class="subtitle">SEARCH &bull; DISCOVER &bull; PLAY</p>
  </div>

  <!-- SEARCH -->
  <div class="position-relative mb-3">
    <input id="search" class="form-control form-control-lg euro-input"
      placeholder="Search Eurobeat songs, artists...">
    <div id="suggest" class="autocomplete"></div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button id="searchBtn" class="btn euro-btn w-100">&#9654; SEARCH</button>
  </div>

  <!-- RESULTS -->
  <div id="resultsSection" style="display:none">
    <div class="results-header mb-3">
      <span id="resultsCount" class="results-label"></span>
    </div>
    <div id="results" class="row g-4"></div>
  </div>

  <!-- LOADING -->
  <div id="loading" class="text-center py-5" style="display:none">
    <div class="euro-spinner"></div>
    <p class="mt-3 loading-text">LOADING TRACKS...</p>
  </div>

  <!-- PLAYER -->
  <div id="playerBar" class="player-bar" style="display:none">
    <div class="player-inner d-flex align-items-center gap-3">
      <img id="playerThumb" src="" alt="" class="player-thumb">
      <div class="player-info flex-grow-1">
        <div id="playerTitle" class="player-title"></div>
        <div id="playerArtist" class="player-artist"></div>
      </div>
      <div class="player-controls">
        <span class="now-playing-badge">&#9654; NOW PLAYING</span>
        <button id="stopBtn" class="btn stop-btn ms-2">&#9646;&#9646; STOP</button>
      </div>
    </div>
    <div class="player-progress">
      <div id="progressBar" class="progress-fill"></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
