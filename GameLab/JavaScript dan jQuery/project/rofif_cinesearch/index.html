<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineSearch — Movie Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- NOISE OVERLAY -->
  <div class="noise"></div>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <span class="logo-cine">CINE</span><span class="logo-search">SEARCH</span>
    </div>
    <p class="tagline">Temukan film favoritmu dalam sekejap</p>
  </header>

  <!-- SEARCH SECTION -->
  <section class="search-section">
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        placeholder="Cari judul film..."
        autocomplete="off"
      />
      <button id="searchBtn">CARI</button>
    </div>

    <!-- FILTER -->
    <div class="filter-wrapper">
      <label for="typeFilter">Tipe:</label>
      <select id="typeFilter">
        <option value="">Semua</option>
        <option value="movie">Film</option>
        <option value="series">Serial</option>
        <option value="episode">Episode</option>
      </select>

      <label for="yearFilter">Tahun:</label>
      <input type="number" id="yearFilter" placeholder="cth: 2023" min="1900" max="2099" />
    </div>
  </section>

  <!-- STATUS MESSAGE -->
  <div id="statusMsg" class="status-msg"></div>

  <!-- LOADING SPINNER -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <p>Mencari film...</p>
  </div>

  <!-- RESULTS GRID -->
  <section id="resultsGrid" class="results-grid"></section>

  <!-- MODAL DETAIL -->
  <div id="modal" class="modal hidden">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-card">
      <button class="modal-close" id="modalClose">&#x2715;</button>
      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>CineSearch &copy; 2025 &mdash; Data oleh <a href="https://www.omdbapi.com" target="_blank">OMDb API</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
