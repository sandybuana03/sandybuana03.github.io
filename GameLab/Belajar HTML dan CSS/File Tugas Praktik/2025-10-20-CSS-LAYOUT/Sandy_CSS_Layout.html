<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Produk Baju - Layout</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fb;
            padding: 20px;
        }

        h1 {
            color: #c30000;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        /* Kartu Produk */
        .product {
            display: inline-block;
            width: 210px;
            margin: 10px;
            padding: 15px;
            background-color: white;
            border: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            vertical-align: top;
            border-radius: 8px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product:hover {
            transform: translateY(-7px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .product-title {
            font-weight: bold;
            color: #b30000;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .product-price {
            color: #b30000;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .btn-detail {
            background-color: #7209b7;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .btn-beli {
            background-color: #ffb3c6;
            color: #333;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .btn-detail:hover {
            background-color: #560bad;
        }

        .btn-beli:hover {
            background-color: #ff94b1;
        }
    </style>
</head>
<body>

    <h1>Produk Baju Kemeja</h1>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRaJmOse0tSMDM-nc29ujswb_zeXOySiPIYeVCfRr6J98c4uf0E1YMNoNhM4ow8vmRTKB8&usqp=CAU" alt="Kemeja Putih">
        <div class="product-title">Kemeja Putih Formal</div>
        <div class="product-price">Rp 180.000,-</div>
        <div class="btn-container">
            <button class="btn-detail">Detail</button>
            <button class="btn-beli">Beli</button>
        </div>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTDha90Qu6Elar7GtmZAt32mdV0hBdGQ3-dnoIx_sKOVV6rNpd8ELiaTpetMBRnlKEjxk&usqp=CAU" alt="Kemeja Kotak">
        <div class="product-title">Kemeja Kotak Casual</div>
        <div class="product-price">Rp 200.000,-</div>
        <div class="btn-container">
            <button class="btn-detail">Detail</button>
            <button class="btn-beli">Beli</button>
        </div>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTu4A_VUyMIFp30zS3Fl6JTIH8QUqd9YjZazKTGQ_Z1_P92q8wRn2ZQ6VDdYu6ejlERBx8&usqp=CAU" alt="Kemeja Denim">
        <div class="product-title">Kemeja Denim Stylish</div>
        <div class="product-price">Rp 250.000,-</div>
        <div class="btn-container">
            <button class="btn-detail">Detail</button>
            <button class="btn-beli">Beli</button>
        </div>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNshvbmLBhdHOy9CGk9bBzSv1Y-2dOE5gl1iQ2RrEPsqD5eyyr95KJwD93f9Qy74nqL2s&usqp=CAU" alt="Kemeja Batik">
        <div class="product-title">Kemeja Batik Modern</div>
        <div class="product-price">Rp 300.000,-</div>
        <div class="btn-container">
            <button class="btn-detail">Detail</button>
            <button class="btn-beli">Beli</button>
        </div>
    </div>

    <div class="product">
        <img src="https://down-id.img.susercontent.com/file/id-11134207-7rasg-m1mzx3fzb6ba0c_tn.webp" alt="Kemeja Hitam Elegan">
        <div class="product-title">Kemeja Hitam Elegan</div>
        <div class="product-price">Rp 220.000,-</div>
        <div class="btn-container">
            <button class="btn-detail">Detail</button>
            <button class="btn-beli">Beli</button>
        </div>
    </div>

</body>
</html>
