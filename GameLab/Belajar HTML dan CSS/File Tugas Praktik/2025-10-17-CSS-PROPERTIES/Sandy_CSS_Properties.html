<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandy_CSS_Properties</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s;
        }

        h1 {
            color: teal;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        ol {
            list-style-type: decimal;
            max-width: 400px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: slideIn 0.5s;
        }

        li {
            background-color: #ffffff;
            margin: 10px;
            padding: 10px;
            border: 2px solid teal;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
            animation: zoomIn 0.5s;
        }

        li:hover {
            background-color: teal;
            color: white;
            cursor: pointer;
            animation: zoomOut 0.5s;
        }

        li:not(:last-child) {
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
                filter: blur(5px);
                box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }
        }

        @keyframes pulse {
            from {
                transform: scale(0.9);
                filter: blur(5px);
            }
            to {
                transform: scale(1);
                filter: blur(0px);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes zoomOut {
            from {
                transform: scale(1);
                opacity: 1;
            }
            to {
                transform: scale(0.9);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>Daftar Film Terbaru Bulan Oktober 2025</h1>
    <ol>
        <li>Maze Runner: The Scorch Trials</li>
        <li>The Transporter Refueled</li>
        <li>Hitman: Agent 47</li>
        <li>War Room</li>
        <li>90 Minutes in Heaven</li>
    </ol>

</body>
</html>
