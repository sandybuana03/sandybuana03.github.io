<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Siswa Baru</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f1f8e9, #e0f7fa);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background: white;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .radio-group {
            margin-bottom: 15px;
        }

        .radio-group input {
            margin-right: 5px;
        }

        input[type="submit"] {
            background-color: #4caf50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #43a047;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <h1>Form Pendaftaran</h1>

        <!-- Nama Lengkap -->
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan email" required>

        <!-- Jenis Kelamin -->
        <label>Jenis Kelamin:</label>
        <div class="radio-group">
            <input type="radio" id="laki" name="gender" value="Laki-laki" required>
            <label for="laki" style="display:inline;">Laki-laki</label>
            <br>
            <input type="radio" id="perempuan" name="gender" value="Perempuan">
            <label for="perempuan" style="display:inline;">Perempuan</label>
        </div>

        <!-- Alamat -->
        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat" placeholder="Tulis alamat lengkap..." required></textarea>

        <!-- Tombol Submit -->
        <input type="submit" value="Kirim">
    </form>

</body>
</html>
