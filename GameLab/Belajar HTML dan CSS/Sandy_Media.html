<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Media Video dan Canvas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 20px;
        }

        video {
            width: 60%;
            max-width: 600px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Canvas untuk judul video -->
    <canvas id="judulCanvas" width="600" height="80"></canvas>

    <!-- Video dengan kontrol -->
    <video controls>
        <source src="video.mp4" type="video/mp4">
        Browser Anda tidak mendukung elemen video.
    </video>

    <script>
        const canvas = document.getElementById('judulCanvas');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#4a4a4a';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Contoh Pemutaran Video', canvas.width / 2, canvas.height / 2);
    </script>

</body>
</html>
