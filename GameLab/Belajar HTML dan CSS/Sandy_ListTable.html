<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Siswa dan Nilai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            max-width: 600px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background-color: #4caf50;
            color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 15px;
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #e8f5e9;
            transition: background-color 0.3s;
        }

        th {
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <h1>Daftar Siswa dan Nilai</h1>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Siswa</th>
                <th>Nilai</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Bima</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Sari</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Andi</td>
                <td>78</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Dewi</td>
                <td>88</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Rian</td>
                <td>92</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
