<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandy Buana - Menampilkan Gambar</title>
</head>
<body>
    <h1>Menampilkan Gambar dengan HTML</h1>

    <p>Berikut adalah gambar yang saya pilih untuk tugas praktik ini:</p>

    <!-- Menampilkan gambar dengan ukuran tertentu -->
    <img src="https://www.gamelab.id/img/gamification/icon-worker.png?v=3" 
         alt="Icon Worker Gamelab" 
         width="200px" 
         height="200px" />

    <p>Gambar di atas ditampilkan menggunakan tag <code>&lt;img&gt;</code> dengan atribut <b>src</b>, <b>alt</b>, <b>width</b>, dan <b>height</b>.</p>
</body>
</html>
