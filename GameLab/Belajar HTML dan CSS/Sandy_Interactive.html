<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Interaktif</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        button {
            background-color: #4caf50;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        /* Alternatif: Link bergaya tombol */
        .link-button {
            display: inline-block;
            background-color: #2196f3;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 15px;
        }

        .link-button:hover {
            background-color: #1976d2;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Kunjungi Website Gamelab</h1>

    <!-- Tombol dengan onclick -->
    <button onclick="window.location.href='https://www.gamelab.id'">
        Klik di Sini
    </button>

    <!-- Alternatif: Link dengan tampilan seperti tombol -->
    <a href="https://www.gamelab.id" target="_blank" class="link-button">
        Buka Gamelab
    </a>

</body>
</html>
