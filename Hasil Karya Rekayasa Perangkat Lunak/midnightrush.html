<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Rush - Game Balap Mobil</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0c0c0c 0%, #2c2c2c 50%, #1a1a1a 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            flex-direction: column;
            overflow: hidden;
        }
        
        html, body {
            height: 100%;
        }
        
        .game-container {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
            border: 1px solid #333;
            max-width: 90vw;
        }
        
        canvas {
            border: 3px solid #16213e;
            border-radius: 10px;
            background: #0f3460;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }
        
        .game-info {
            color: white;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            flex-wrap: wrap;
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .controls {
            color: #a8a8a8;
            font-size: 14px;
        }
        
        .main-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0a0a0a 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            border: 2px solid #444;
            z-index: 1000;
        }
        
        .game-title {
            font-size: 36px;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5), 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .game-subtitle {
            font-size: 18px;
            color: #a8a8a8;
            margin-bottom: 30px;
        }
        
        .menu-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            user-select: none;
        }
        
        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }
        
        .player-btn {
            background: linear-gradient(45deg, #3742fa, #2f3542);
            box-shadow: 0 5px 15px rgba(55, 66, 250, 0.3);
        }
        
        .player-btn:hover {
            box-shadow: 0 8px 25px rgba(55, 66, 250, 0.4);
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 1001;
            border: 2px solid #ff6b6b;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
            user-select: none;
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
        }
        
        .car-icon {
            font-size: 48px;
            margin: 20px 0;
        }
        
        .mobile-controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        
        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            user-select: none;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        
        .control-btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
        
        .left-btn:active, .right-btn:active {
            background: linear-gradient(145deg, #3742fa, #2f3542);
        }
        
        .nos-btn {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #ff6b6b, #ee5a24);
        }
        
        .nos-btn:active {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
        }
        
        .nos-label {
            font-size: 10px;
            font-weight: bold;
            color: white;
            margin-top: 2px;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 10px;
            }
            
            canvas {
                width: 100%;
                max-width: 400px;
            }
            
            .main-menu {
                padding: 20px;
                max-width: 90vw;
            }
            
            .game-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-menu" id="mainMenu">
            <div class="game-title">🏎️ MIDNIGHT RUSH</div>
            <div class="game-subtitle">Selamat datang di game balap mobil!</div>
            <div class="car-icon">
                <svg width="140" height="70" viewBox="0 0 140 70" style="margin: 20px 0;">
                    <!-- Formula 1 Racing Car Body -->
                    <!-- Main chassis -->
                    <path d="M 20 35 L 120 35 L 115 30 L 110 25 L 25 25 L 20 30 Z" fill="#ff4757" stroke="#000" stroke-width="2"/>
                    <!-- Nose cone -->
                    <path d="M 5 35 L 20 35 L 20 30 L 10 28 Z" fill="#e74c3c" stroke="#000" stroke-width="1"/>
                    <!-- Cockpit -->
                    <path d="M 50 25 L 90 25 L 85 15 L 55 15 Z" fill="#2c2c2c" stroke="#000" stroke-width="1"/>
                    <!-- Driver helmet -->
                    <circle cx="70" cy="20" r="6" fill="#ffd700" stroke="#000" stroke-width="1"/>
                    <!-- Front wing -->
                    <rect x="8" y="32" width="15" height="2" fill="#333" stroke="#000" stroke-width="1"/>
                    <rect x="8" y="36" width="15" height="2" fill="#333" stroke="#000" stroke-width="1"/>
                    <!-- Rear wing -->
                    <rect x="115" y="20" width="8" height="2" fill="#333" stroke="#000" stroke-width="1"/>
                    <rect x="115" y="24" width="8" height="2" fill="#333" stroke="#000" stroke-width="1"/>
                    <rect x="117" y="18" width="4" height="10" fill="#333"/>
                    <!-- Side pods -->
                    <ellipse cx="40" cy="35" rx="8" ry="6" fill="#c0392b"/>
                    <ellipse cx="100" cy="35" rx="8" ry="6" fill="#c0392b"/>
                    <!-- Racing stripes -->
                    <rect x="25" y="32" width="85" height="2" fill="#fff"/>
                    <rect x="25" y="36" width="85" height="2" fill="#fff"/>
                    <!-- Front wheels -->
                    <circle cx="25" cy="45" r="10" fill="#1e1e1e" stroke="#333" stroke-width="3"/>
                    <circle cx="25" cy="45" r="6" fill="#444"/>
                    <circle cx="25" cy="45" r="3" fill="#666"/>
                    <!-- Rear wheels (larger) -->
                    <circle cx="105" cy="45" r="12" fill="#1e1e1e" stroke="#333" stroke-width="3"/>
                    <circle cx="105" cy="45" r="8" fill="#444"/>
                    <circle cx="105" cy="45" r="4" fill="#666"/>
                    <!-- Exhaust pipes -->
                    <circle cx="125" cy="32" r="2" fill="#555"/>
                    <circle cx="125" cy="38" r="2" fill="#555"/>
                    <!-- Racing number -->
                    <text x="70" y="33" font-family="Arial" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
                    <!-- Headlights/LED strips -->
                    <rect x="12" y="30" width="6" height="1" fill="#00ffff"/>
                    <rect x="12" y="37" width="6" height="1" fill="#00ffff"/>
                    <!-- Brake discs -->
                    <circle cx="25" cy="45" r="8" fill="none" stroke="#ff6b6b" stroke-width="1"/>
                    <circle cx="105" cy="45" r="10" fill="none" stroke="#ff6b6b" stroke-width="1"/>
                </svg>
            </div>
            <button class="menu-btn player-btn" onclick="startGame(1)">Player 1 Solo</button>
            <button class="menu-btn player-btn" onclick="startGame(2)" style="background: linear-gradient(45deg, #ff4757, #ee5a24); box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);">Player 2 Solo</button>
            <button class="menu-btn player-btn" onclick="startGame(3)" style="background: linear-gradient(45deg, #2ed573, #20bf6b); box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3);">2 Players</button>
            <div style="margin-top: 20px; font-size: 14px; color: #a8a8a8;">
                <strong>Player 1:</strong> Panah ← → untuk bergerak, Spasi untuk turbo<br>
                <strong>Player 2:</strong> A D untuk bergerak, Shift untuk turbo<br>
                <strong>2 Players:</strong> Bermain berdua di layar yang sama!
            </div>
        </div>
        
        <div class="game-info" id="gameInfo" style="display: none;">
            <div class="score">Skor: <span id="score">0</span></div>
            <div class="controls" id="controlsInfo">Gunakan ← → untuk bergerak, Spasi untuk turbo</div>
        </div>
        <canvas id="gameCanvas" width="600" height="400" style="display: none;"></canvas>
        
        <!-- Mobile Controls -->
        <div class="mobile-controls" id="mobileControls" style="display: none;">
            <div class="control-row">
                <button class="control-btn left-btn" id="leftBtn">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="white">
                        <path d="M20 5 L10 15 L20 25" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="control-btn nos-btn" id="nosBtn">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="#ffd700">
                        <path d="M15 2 L12 10 L18 8 L10 20 L13 12 L7 14 L15 2 Z" fill="#ffd700" stroke="#ffaa00" stroke-width="1"/>
                    </svg>
                    <div class="nos-label">NOS</div>
                </button>
                <button class="control-btn right-btn" id="rightBtn">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="white">
                        <path d="M10 5 L20 15 L10 25" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>🏁 Game Over!</h2>
            <p>Skor Akhir: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">🔄 Main Lagi</button>
            <button class="restart-btn" onclick="backToMenu()" style="background: linear-gradient(45deg, #3742fa, #2f3542); margin-left: 10px;">🏠 Menu Utama</button>
        </div>
    </div>

    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            initializeGame();
        });

        function initializeGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('score');
            const gameOverElement = document.getElementById('gameOver');
            const finalScoreElement = document.getElementById('finalScore');
            const mainMenuElement = document.getElementById('mainMenu');
            const gameInfoElement = document.getElementById('gameInfo');

            // Game state
            let gameRunning = false;
            let gameStarted = false;
            let score = 0;
            let gameSpeed = 2;
            let currentPlayer = 1;
            let twoPlayerMode = false;
            let animationId = null;

            // Player cars
            const player1 = {
                x: canvas.width / 4 - 25,
                y: canvas.height - 80,
                width: 50,
                height: 70,
                speed: 5,
                turbo: false
            };

            const player2 = {
                x: (canvas.width * 3) / 4 - 25,
                y: canvas.height - 80,
                width: 50,
                height: 70,
                speed: 5,
                turbo: false
            };

            // For single player mode compatibility
            let player = player1;

            // Obstacles
            let obstacles = [];
            let obstacleTimer = 0;

            // Road lines
            let roadLines = [];
            for (let i = 0; i < 10; i++) {
                roadLines.push({
                    x: canvas.width / 2 - 5,
                    y: i * 60 - 300,
                    width: 10,
                    height: 30
                });
            }

            // Input handling - improved for Chrome compatibility
            const keys = {};
            
            document.addEventListener('keydown', function(e) {
                keys[e.key] = true;
                keys[e.code] = true;
                // Prevent default for game keys only
                if (['ArrowLeft', 'ArrowRight', 'Space', 'KeyA', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });
            
            document.addEventListener('keyup', function(e) {
                keys[e.key] = false;
                keys[e.code] = false;
                if (['ArrowLeft', 'ArrowRight', 'Space', 'KeyA', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });

            // Mobile control buttons
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const nosBtn = document.getElementById('nosBtn');
            const mobileControls = document.getElementById('mobileControls');

            // Improved touch controls for Chrome
            function setupButton(button, keyName) {
                // Mouse events
                button.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    keys[keyName] = true;
                });
                
                button.addEventListener('mouseup', function(e) {
                    e.preventDefault();
                    keys[keyName] = false;
                });
                
                button.addEventListener('mouseleave', function(e) {
                    keys[keyName] = false;
                });
                
                // Touch events
                button.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    keys[keyName] = true;
                });
                
                button.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    keys[keyName] = false;
                });
                
                button.addEventListener('touchcancel', function(e) {
                    e.preventDefault();
                    keys[keyName] = false;
                });
            }

            setupButton(leftBtn, 'ArrowLeft');
            setupButton(rightBtn, 'ArrowRight');
            setupButton(nosBtn, ' ');

            // Draw single player car
            function drawSinglePlayer(playerObj, playerNum) {
                const x = playerObj.x;
                const y = playerObj.y;
                const w = playerObj.width;
                const h = playerObj.height;
                
                // Main car body - different colors for different players
                if (playerNum === 1) {
                    ctx.fillStyle = '#3742fa'; // Blue for Player 1
                } else {
                    ctx.fillStyle = '#ff4757'; // Red for Player 2
                }
                ctx.fillRect(x, y, w, h);
                
                // Black outline
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
                
                // Racing stripes - different colors for different players
                if (playerNum === 1) {
                    ctx.fillStyle = '#000000'; // Black stripes for Player 1
                } else {
                    ctx.fillStyle = '#ffffff'; // White stripes for Player 2
                }
                ctx.fillRect(x + w/2 - 3, y, 2, h); // Left racing stripe
                ctx.fillRect(x + w/2 + 1, y, 2, h); // Right racing stripe
                
                // Car details for player (windows in black)
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 5, y + 10, w - 10, 12);
                ctx.fillRect(x + 5, y + 35, w - 10, 12);
                
                // Square headlights at the front
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(x + 8, y - 5, 8, 8); // Left headlight
                ctx.fillRect(x + w - 16, y - 5, 8, 8); // Right headlight
                
                // Headlight outline
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 8, y - 5, 8, 8);
                ctx.strokeRect(x + w - 16, y - 5, 8, 8);
                
                // Wheels (square like NPC)
                ctx.fillStyle = '#1e1e1e';
                // Front left wheel
                ctx.fillRect(x - 5, y + 10, 8, 15);
                // Front right wheel
                ctx.fillRect(x + w - 3, y + 10, 8, 15);
                // Rear left wheel
                ctx.fillRect(x - 5, y + 45, 8, 15);
                // Rear right wheel
                ctx.fillRect(x + w - 3, y + 45, 8, 15);
                
                // Turbo effect
                if (playerObj.turbo) {
                    ctx.fillStyle = '#ffa502';
                    ctx.fillRect(x + 15, y + 70, 8, 15);
                    ctx.fillRect(x + 27, y + 70, 8, 15);
                }
            }

            // Draw player car(s)
            function drawPlayer() {
                if (twoPlayerMode) {
                    drawSinglePlayer(player1, 1);
                    drawSinglePlayer(player2, 2);
                } else {
                    drawSinglePlayer(player, currentPlayer);
                }
            }

            // Draw obstacles
            function drawObstacles() {
                obstacles.forEach(obstacle => {
                    ctx.fillStyle = obstacle.color;
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    if (obstacle.type === 'truck') {
                        // Truck details - larger and more detailed
                        ctx.fillStyle = '#2f3542';
                        // Truck cab
                        ctx.fillRect(obstacle.x + 5, obstacle.y + 5, obstacle.width - 10, 20);
                        // Truck cargo area
                        ctx.fillRect(obstacle.x + 3, obstacle.y + 25, obstacle.width - 6, obstacle.height - 30);
                        
                        // Truck wheels (more wheels for truck)
                        ctx.fillStyle = '#1e1e1e';
                        ctx.fillRect(obstacle.x - 3, obstacle.y + 15, 6, 12);
                        ctx.fillRect(obstacle.x + obstacle.width - 3, obstacle.y + 15, 6, 12);
                        ctx.fillRect(obstacle.x - 3, obstacle.y + 35, 6, 12);
                        ctx.fillRect(obstacle.x + obstacle.width - 3, obstacle.y + 35, 6, 12);
                        ctx.fillRect(obstacle.x - 3, obstacle.y + 55, 6, 12);
                        ctx.fillRect(obstacle.x + obstacle.width - 3, obstacle.y + 55, 6, 12);
                    } else {
                        // Regular car details
                        ctx.fillStyle = '#2f3542';
                        ctx.fillRect(obstacle.x + 5, obstacle.y + 10, obstacle.width - 10, 12);
                        ctx.fillRect(obstacle.x + 5, obstacle.y + 35, obstacle.width - 10, 12);
                        
                        // Regular car wheels
                        ctx.fillStyle = '#1e1e1e';
                        ctx.fillRect(obstacle.x - 3, obstacle.y + 8, 6, 12);
                        ctx.fillRect(obstacle.x + obstacle.width - 3, obstacle.y + 8, 6, 12);
                        ctx.fillRect(obstacle.x - 3, obstacle.y + 35, 6, 12);
                        ctx.fillRect(obstacle.x + obstacle.width - 3, obstacle.y + 35, 6, 12);
                    }
                });
            }

            // Draw road
            function drawRoad() {
                // Road background
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Road surface
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(50, 0, canvas.width - 100, canvas.height);
                
                // Road lines
                ctx.fillStyle = '#ffffff';
                roadLines.forEach(line => {
                    ctx.fillRect(line.x, line.y, line.width, line.height);
                });
                
                // Side barriers
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(45, 0, 10, canvas.height);
                ctx.fillRect(canvas.width - 55, 0, 10, canvas.height);
                
                // Center divider for two player mode
                if (twoPlayerMode) {
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(canvas.width / 2 - 2, 0, 4, canvas.height);
                    
                    // Dashed center line
                    ctx.fillStyle = '#ffffff';
                    for (let i = 0; i < canvas.height; i += 20) {
                        ctx.fillRect(canvas.width / 2 - 1, i, 2, 10);
                    }
                }
            }

            // Check collision between player and obstacles
            function checkCollision(playerObj) {
                for (let i = 0; i < obstacles.length; i++) {
                    const obstacle = obstacles[i];
                    if (playerObj.x < obstacle.x + obstacle.width &&
                        playerObj.x + playerObj.width > obstacle.x &&
                        playerObj.y < obstacle.y + obstacle.height &&
                        playerObj.y + playerObj.height > obstacle.y) {
                        return true;
                    }
                }
                return false;
            }

            // Update game objects
            function update() {
                if (!gameRunning) return;

                if (twoPlayerMode) {
                    // Two player mode - both players move
                    // Player 1 controls
                    player1.turbo = keys[' '] || keys['Space'];
                    let speed1 = player1.turbo ? player1.speed * 2.5 : player1.speed;
                    if ((keys['ArrowLeft'] || keys['KeyA']) && player1.x > 60) {
                        player1.x -= speed1;
                    }
                    if ((keys['ArrowRight'] || keys['KeyD']) && player1.x < canvas.width / 2 - player1.width - 10) {
                        player1.x += speed1;
                    }

                    // Player 2 controls
                    player2.turbo = keys['Shift'] || keys['ShiftLeft'] || keys['ShiftRight'];
                    let speed2 = player2.turbo ? player2.speed * 2.5 : player2.speed;
                    if ((keys['a'] || keys['A'] || keys['KeyA']) && player2.x > canvas.width / 2 + 10) {
                        player2.x -= speed2;
                    }
                    if ((keys['d'] || keys['D'] || keys['KeyD']) && player2.x < canvas.width - player2.width - 60) {
                        player2.x += speed2;
                    }
                } else {
                    // Single player mode
                    player.turbo = keys[' '] || keys['Space'];
                    let currentSpeed = player.turbo ? player.speed * 2.5 : player.speed;
                    
                    // Different controls for different players
                    if (currentPlayer === 1) {
                        // Player 1 uses arrow keys
                        if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 60) {
                            player.x -= currentSpeed;
                        }
                        if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width - 60) {
                            player.x += currentSpeed;
                        }
                    } else {
                        // Player 2 uses A and D keys
                        if ((keys['a'] || keys['A'] || keys['KeyA']) && player.x > 60) {
                            player.x -= currentSpeed;
                        }
                        if ((keys['d'] || keys['D'] || keys['KeyD']) && player.x < canvas.width - player.width - 60) {
                            player.x += currentSpeed;
                        }
                    }
                }

                // Update road lines
                roadLines.forEach(line => {
                    line.y += gameSpeed;
                    if (line.y > canvas.height) {
                        line.y = -60;
                    }
                });

                // Create obstacles
                obstacleTimer++;
                // Random spawn timing between 40-80 frames
                const spawnDelay = 40 + Math.random() * 40;
                if (obstacleTimer > spawnDelay - gameSpeed * 3) {
                    const colors = ['#3742fa', '#2ed573', '#ffa502', '#ff4757', '#a4b0be'];
                    const truckColors = ['#8b4513', '#654321', '#2f4f4f', '#696969'];
                    
                    // Random chance to spawn a truck (20-40% based on score)
                    const truckChance = 0.2 + (score / 1000) * 0.2;
                    const isTruck = Math.random() < Math.min(truckChance, 0.4);
                    
                    if (isTruck) {
                        obstacles.push({
                            x: Math.random() * (canvas.width - 180) + 75,
                            y: -80,
                            width: 55,
                            height: 80,
                            color: truckColors[Math.floor(Math.random() * truckColors.length)],
                            type: 'truck',
                            speed: gameSpeed * 1.7
                        });
                    } else {
                        obstacles.push({
                            x: Math.random() * (canvas.width - 150) + 75,
                            y: -60,
                            width: 45,
                            height: 60,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            type: 'car',
                            speed: gameSpeed * 1.7
                        });
                    }
                    obstacleTimer = 0;
                }

                // Update obstacles
                obstacles.forEach((obstacle, index) => {
                    obstacle.y += obstacle.speed;
                    
                    // Remove obstacles that are off screen
                    if (obstacle.y > canvas.height) {
                        obstacles.splice(index, 1);
                        // Give more points for avoiding trucks
                        score += obstacle.type === 'truck' ? 15 : 10;
                        scoreElement.textContent = score;
                    }
                    
                    // Collision detection
                    if (twoPlayerMode) {
                        if (checkCollision(player1) || checkCollision(player2)) {
                            gameOver();
                        }
                    } else {
                        if (checkCollision(player)) {
                            gameOver();
                        }
                    }
                });

                // Increase game speed
                if (score > 0 && score % 100 === 0) {
                    gameSpeed += 0.1;
                }
            }

            // Game over
            function gameOver() {
                gameRunning = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                finalScoreElement.textContent = score;
                gameOverElement.style.display = 'block';
            }

            // Restart game
            window.restartGame = function() {
                gameRunning = true;
                score = 0;
                gameSpeed = 2;
                obstacles = [];
                obstacleTimer = 0;
                
                if (twoPlayerMode) {
                    player1.x = canvas.width / 4 - 25;
                    player1.y = canvas.height - 80;
                    player2.x = (canvas.width * 3) / 4 - 25;
                    player2.y = canvas.height - 80;
                } else {
                    player.x = canvas.width / 2 - 25;
                    player.y = canvas.height - 80;
                }
                
                scoreElement.textContent = score;
                gameOverElement.style.display = 'none';
                gameLoop();
            }

            // Start game function
            window.startGame = function(playerNumber = 1) {
                currentPlayer = playerNumber;
                twoPlayerMode = (playerNumber === 3);
                gameStarted = true;
                gameRunning = true;
                mainMenuElement.style.display = 'none';
                gameInfoElement.style.display = 'flex';
                canvas.style.display = 'block';
                mobileControls.style.display = 'block';
                
                // Update controls info based on player
                const controlsInfo = document.getElementById('controlsInfo');
                if (twoPlayerMode) {
                    controlsInfo.textContent = 'P1: ← → + Spasi | P2: A D + Shift';
                } else if (currentPlayer === 1) {
                    controlsInfo.textContent = 'Player 1: Gunakan ← → untuk bergerak, Spasi untuk turbo';
                } else {
                    controlsInfo.textContent = 'Player 2: Gunakan A D untuk bergerak, Spasi untuk turbo';
                }
                
                // Reset game state
                score = 0;
                gameSpeed = 2;
                obstacles = [];
                obstacleTimer = 0;
                
                if (twoPlayerMode) {
                    player1.x = canvas.width / 4 - 25;
                    player1.y = canvas.height - 80;
                    player2.x = (canvas.width * 3) / 4 - 25;
                    player2.y = canvas.height - 80;
                } else {
                    if (currentPlayer === 1) {
                        player = player1;
                    } else {
                        player = player2;
                    }
                    player.x = canvas.width / 2 - 25;
                    player.y = canvas.height - 80;
                }
                
                scoreElement.textContent = score;
                gameLoop();
            }
            
            // Back to menu function
            window.backToMenu = function() {
                gameStarted = false;
                gameRunning = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                mainMenuElement.style.display = 'block';
                gameInfoElement.style.display = 'none';
                canvas.style.display = 'none';
                mobileControls.style.display = 'none';
                gameOverElement.style.display = 'none';
            }

            // Game loop
            function gameLoop() {
                if (gameStarted && gameRunning) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    drawRoad();
                    drawObstacles();
                    drawPlayer();
                    update();
                    
                    animationId = requestAnimationFrame(gameLoop);
                }
            }

            // Initialize canvas context
            if (ctx) {
                console.log('Game initialized successfully!');
            } else {
                console.error('Canvas context not available');
            }
        }
    </script>
