    coin:document.getElementById('coinDisplay'),power:document.getElementById('powerDisplay'),
    status:document.getElementById('status'),overlay:document.getElementById('overlay'),
    title:document.getElementById('overlayTitle'),message:document.getElementById('overlayMessage'),
    button:document.getElementById('overlayButton'),board:document.getElementById('boardText')
  };
  const themes=[
    {name:'Hutan Alien',icon:'🌿',sky:'#207b91',ground:'#427d48',top:'#b3e479',normal:20,special:2,width:3200,
      platforms:[[310,389,150],[630,330,145],[970,380,160],[1300,315,150],[1670,370,160],[2010,320,150],[2370,390,165],[2700,330,150]],
      hazards:[540,890,1510,1850,2210,2580],power:[1050,'jump'],enemy:[]},
    {name:'Gua Gelap',icon:'💎',sky:'#302d65',ground:'#605082',top:'#a99bd8',normal:25,special:3,width:3900,
      platforms:[[320,380,150],[660,325,145],[1020,370,160],[1400,305,155],[1790,365,155],[2190,315,150],[2580,375,160],[2990,315,150],[3370,370,160]],
      hazards:[530,880,1250,1630,2010,2400,2810,3220],power:[1480,'speed'],enemy:[]},
    {name:'Kota Alien',icon:'🏙️',sky:'#324b89',ground:'#506a8c',top:'#8bdbef',normal:30,special:5,width:4500,
      platforms:[[340,380,160],[720,325,155],[1100,375,170],[1480,315,160],[1850,375,160],[2230,320,170],[2630,385,160],[3020,320,160],[3420,370,165],[3830,315,160]],
      hazards:[560,970,1350,1730,2110,2490,2880,3290,3700,4110],power:[2280,'jump'],enemy:[800,1580,2700,3530]}
  ];
  const W=960,H=540,floor=465;
  let level=0,completedScore=0,score=0,coins=[],hazards=[],platforms=[],pickup=null,player=null,camera=0;
  let running=false,finished=false,frame=0,last=0,jumpConsumed=false,powerUntil=0,powerType='',invuln=0;
  const keys={left:false,right:false,jump:false};
  let audioCtx=null,musicTimer=null,musicOn=false,note=0;
  function say(t){ui.status.textContent=t}
  function updateHud(){
    const t=themes[level];
    ui.level.textContent=`${t.icon} ${t.name} · Level ${level+1}/3`;
    ui.score.textContent=`⭐ Skor ${score}`;
    ui.coin.textContent=`🪙 ${coins.filter(x=>x.taken).length}/${coins.length}`;
    ui.power.textContent=powerUntil>performance.now()?`✨ ${powerType==='jump'?'Lompat tinggi':'Kecepatan ekstra'} · ${Math.ceil((powerUntil-performance.now())/1000)}d`:'✨ Power-up: tidak ada';
  }
  function makeLevel(){
    const t=themes[level];
    player={x:65,y:floor-40,w:32,h:40,vx:0,vy:0,onGround:false,carry:0};
    camera=0;frame=0;powerUntil=0;powerType='';invuln=0;
    platforms=t.platforms.map((p,i)=>({x:p[0],y:p[1],w:p[2],h:19,base:p[0],moving:level===2&&(i===2||i===6),oldX:p[0]}));
    hazards=t.hazards.map((x,i)=>({x,type:level===0?'spike':level===1?(i%2?'rock':'stalactite'):'spike',phase:i*1.7}));
    coins=[];
    for(let i=0;i<t.normal;i++){
      const x=165+i*(t.width-350)/(t.normal-1);
      const near=platforms.find(p=>x>p.base+18&&x<p.base+p.w-18);
      coins.push({x,y:near?near.y-39:floor-39,special:false,taken:false});
    }
    for(let i=0;i<t.special;i++){
      const p=platforms[Math.min(platforms.length-1,Math.round((i+.5)*platforms.length/t.special)-1)];
      coins.push({x:p.base+p.w/2,y:p.y-75,special:true,taken:false});
    }
    pickup={x:t.power[0],y:floor-48,type:t.power[1],taken:false};
    score=completedScore;updateHud();
  }
  function showOverlay(title,message,button){
    ui.title.textContent=title;ui.message.textContent=message;ui.button.textContent=button;
    ui.overlay.classList.remove('hidden');
  }
  function start(){
    if(finished){level=0;completedScore=0;finished=false;makeLevel()}
    running=true;ui.overlay.classList.add('hidden');say('Ambil koin dan capai portal di ujung level!');
  }
  ui.button.addEventListener('click',start);
  document.getElementById('restartBtn').addEventListener('click',()=>{
    level=0;completedScore=0;finished=false;makeLevel();running=true;
    ui.overlay.classList.add('hidden');say('Petualangan dimulai lagi!');
  });
  function bindControl(id,key){
    const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[key]=true;el.classList.add('pressed')});
    const release=()=>{keys[key]=false;el.classList.remove('pressed')};
    el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);
  }
  bindControl('leftBtn','left');bindControl('rightBtn','right');bindControl('jumpBtn','jump');
  const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
  window.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();keys[k]=true}});
  window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();keys[k]=false}});
  window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});
  function beep(freq,duration=.09,volume=.045){
    if(!audioCtx||!musicOn)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
    o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(volume,now);
    g.gain.exponentialRampToValueAtTime(.001,now+duration);
    o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+duration);
  }
  document.getElementById('soundBtn').addEventListener('click',async e=>{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();musicOn=!musicOn;
    e.currentTarget.textContent=musicOn?'♫ Musik: nyala':'♫ Musik: mati';
    e.currentTarget.setAttribute('aria-pressed',String(musicOn));
    if(musicTimer){clearInterval(musicTimer);musicTimer=null}
    if(musicOn){
      const melody=[392,494,587,494,440,523,659,523,392,494,587,784,659,523,494,440];
      musicTimer=setInterval(()=>{beep(melody[note++%melody.length],.16,.025)},220);
    }
  });
  const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  function fail(){
    running=false;keys.jump=false;showOverlay('Ups, kena rintangan!','Koin pada level ini kembali ke tempatnya. Coba atur waktu lompatanmu!','Coba lagi →');
    makeLevel();say('Tidak apa-apa, coba lagi!');
  }
  function complete(){
    running=false;completedScore=score;
    if(level<2){
      const previous=themes[level].name;level++;makeLevel();
      showOverlay('Level selesai! ✨',`${previous} berhasil dilewati. Siap melanjutkan ke ${themes[level].name}?`,'Level berikutnya →');
      say('Bagus! Tantangan berikutnya menunggu.');
    }else{
      finished=true;
      const prev=Number(ui.board.dataset.best||0),best=Math.max(prev,score);
      ui.board.dataset.best=String(best);
      ui.board.textContent=`🏆 Skor tertinggi sesi ini: ${best} poin · Skor permainan terakhir: ${score} poin`;
      showOverlay('Uang jajan terkumpul! 🎉',`Mr. Alien menuntaskan tiga level dengan ${score} poin. Ayah pasti bangga!`,'Main lagi →');
      say('Selamat! Semua level selesai.');
    }
  }
  function update(dt){
    if(!running)return;
    const t=themes[level],step=Math.min(dt/16.67,2);
    frame+=step;
    const boosted=powerUntil>performance.now();
    const speed=boosted&&powerType==='speed'?6.6:4.2;
    player.vx=(Number(keys.right)-Number(keys.left))*speed;
    if(keys.jump&&player.onGround&&!jumpConsumed){
      player.vy=boosted&&powerType==='jump'?-15.8:-12.6;
      player.onGround=false;jumpConsumed=true;beep(520,.09);
    }
    if(!keys.jump){jumpConsumed=false;if(player.vy< -5)player.vy=-5}
    platforms.forEach(p=>{p.oldX=p.x;if(p.moving)p.x=p.base+Math.sin(frame*.027+p.base)*68});
    player.x=Math.max(0,Math.min(t.width-player.w,player.x+player.vx*step));
    const oldBottom=player.y+player.h;
    player.vy=Math.min(15,player.vy+.61*step);
    player.y+=player.vy*step;player.onGround=false;player.carry=0;
    if(player.vy>=0){
      let landing=floor;
      for(const p of platforms){
        if(player.x+player.w>p.x+7&&player.x<p.x+p.w-7&&oldBottom<=p.y+10&&player.y+player.h>=p.y&&p.y<landing){
          landing=p.y;player.carry=p.x-p.oldX;
        }
      }
      if(player.y+player.h>=landing){
        player.y=landing-player.h;player.vy=0;player.onGround=true;
        player.x+=player.carry;
      }
    }
    for(const coin of coins){
      if(!coin.taken&&Math.abs(player.x+16-coin.x)<24&&Math.abs(player.y+19-coin.y)<30){
        coin.taken=true;score+=coin.special?50:10;beep(coin.special?900:740,.12);updateHud();
      }
    }
    if(!pickup.taken&&Math.abs(player.x+16-pickup.x)<25&&Math.abs(player.y+20-pickup.y)<37){
      pickup.taken=true;powerType=pickup.type;powerUntil=performance.now()+8000;
      say(powerType==='jump'?'Power-up: lompat tinggi selama 8 detik!':'Power-up: kecepatan ekstra selama 8 detik!');
      beep(1100,.25);updateHud();
    }
    if(frame%25<2)updateHud();
    if(player.x>t.width-105){complete();return}
    if(invuln>0)invuln-=step;
    for(const h of hazards){
      let box;
      if(h.type==='spike')box={x:h.x,y:floor-23,w:38,h:23};
      else if(h.type==='stalactite')box={x:h.x,y:0,w:35,h:floor-345};
      else{
        const y=45+((frame*3.3+h.phase*105)%(floor+100));
        box={x:h.x,y,w:32,h:32};
      }
      if(overlap(player,box)){fail();return}
    }
    for(const base of t.enemy){
      const x=base+Math.sin(frame*.035+base)*48;
      if(overlap(player,{x,y:floor-39,w:35,h:39})){fail();return}
    }
    camera=Math.max(0,Math.min(t.width-W,player.x-280));
  }
  function roundRect(x,y,w,h,r,color){
    c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();
  }
  function draw(){
    const t=themes[level];
    const bg=c.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,t.sky);bg.addColorStop(1,level===1?'#16142e':'#244662');
    c.fillStyle=bg;c.fillRect(0,0,W,H);
    c.save();c.translate(-camera*.18,0);
    for(let i=0;i<22;i++){
      const x=((i*157+40)%(t.width*.4+W)),y=36+(i*79)%245;
      c.fillStyle='#ffffff88';c.beginPath();c.arc(x,y,i%4===0?2.5:1.5,0,Math.PI*2);c.fill();
    }
    c.restore();
    c.save();c.translate(-camera*.42,0);
    for(let i=0;i<Math.ceil(t.width/200)+5;i++){
      const x=i*205-40;
      if(level===0){
        c.fillStyle='#195c66';c.beginPath();c.arc(x+65,390,91,0,7);c.fill();
        c.fillStyle='#164c60';c.fillRect(x+52,360,24,115);
      }else if(level===1){
        c.fillStyle='#4a427b';c.beginPath();c.moveTo(x-70,465);c.lineTo(x+45,275+(i%3)*30);c.lineTo(x+155,465);c.fill();
      }else{
        c.fillStyle='#293d70';c.fillRect(x,285-(i%3)*42,145,200);
        c.fillStyle='#7bd5e577';
        for(let j=0;j<3;j++)for(let k=0;k<3;k++)c.fillRect(x+18+j*38,315-(i%3)*42+k*47,15,20);
      }
    }
    c.restore();
    c.save();c.translate(-camera,0);
    c.fillStyle=t.ground;c.fillRect(0,floor,t.width,H-floor);
    c.fillStyle=t.top;c.fillRect(0,floor,t.width,10);
    for(let x=25;x<t.width;x+=76){
      c.fillStyle='#ffffff22';c.beginPath();c.arc(x,floor+29+(x%3)*13,3,0,7);c.fill();
    }
    for(const p of platforms){
      roundRect(p.x,p.y,p.w,p.h,7,level===0?'#8d6547':level===1?'#7771a7':'#4687a9');
      roundRect(p.x,p.y,p.w,7,4,t.top);
      if(level===0){c.fillStyle='#533d38';c.fillRect(p.x+15,p.y+11,5,5);c.fillRect(p.x+p.w-25,p.y+11,5,5)}
      if(p.moving){c.fillStyle='#d4f9ff';c.fillRect(p.x+10,p.y+11,p.w-20,2)}
    }
    for(const h of hazards){
      if(h.type==='spike'){
        c.fillStyle=level===2?'#ff8295':'#ff8a71';
        for(let j=0;j<3;j++){c.beginPath();c.moveTo(h.x+j*13,floor);c.lineTo(h.x+j*13+7,floor-24);c.lineTo(h.x+j*13+14,floor);c.fill()}
      }else if(h.type==='stalactite'){
        c.fillStyle='#b3a9db';c.beginPath();c.moveTo(h.x,0);c.lineTo(h.x+36,0);c.lineTo(h.x+18,115);c.fill();
      }else{
        const y=45+((frame*3.3+h.phase*105)%(floor+100));
        c.fillStyle='#c2a9bb';c.beginPath();c.arc(h.x+16,y+16,16,0,7);c.fill();
        c.fillStyle='#e1d3dc';c.beginPath();c.arc(h.x+10,y+9,4,0,7);c.fill();
      }
    }
    for(const base of t.enemy){
      const x=base+Math.sin(frame*.035+base)*48;
      roundRect(x,floor-39,35,34,8,'#ee777e');
      c.fillStyle='#d7f8fc';c.fillRect(x+7,floor-29,21,11);
      c.fillStyle='#244870';c.fillRect(x+14,floor-27,5,7);
      c.strokeStyle='#ee777e';c.lineWidth=3;c.beginPath();c.moveTo(x+17,floor-39);c.lineTo(x+17,floor-48);c.stroke();
      c.fillStyle='#ffe486';c.beginPath();c.arc(x+17,floor-49,4,0,7);c.fill();
    }
    for(const coin of coins){
      if(coin.taken)continue;
      const bob=Math.sin(frame*.07+coin.x)*3,r=coin.special?13:10;
      c.fillStyle=coin.special?'#fff3a4':'#ffd25d';c.beginPath();c.arc(coin.x,coin.y+bob,r,0,7);c.fill();
      c.strokeStyle=coin.special?'#ff9c72':'#e89b38';c.lineWidth=3;c.stroke();
      c.fillStyle='#af741e';c.font=`bold ${coin.special?15:12}px DM Sans`;c.textAlign='center';c.fillText(coin.special?'★':'$',coin.x,coin.y+bob+5);
    }
    if(!pickup.taken){
      const y=pickup.y+Math.sin(frame*.06)*5;
      roundRect(pickup.x-15,y-15,30,30,9,pickup.type==='jump'?'#b7f482':'#8ee7f4');
      c.fillStyle='#1c4658';c.font='bold 21px DM Sans';c.textAlign='center';c.fillText(pickup.type==='jump'?'↑':'»',pickup.x,y+8);
    }
    const end=t.width-62;
    roundRect(end-10,floor-95,60,95,24,'#304b80');
    roundRect(end,floor-85,40,78,19,'#96f5ce');
    c.fillStyle='#315c68';c.font='bold 14px DM Sans';c.textAlign='center';c.fillText('FINISH',end+20,floor-105);
    // Mr. Alien: rounded body, antennae, large eyes, and small feet.
    c.save();c.translate(player.x+16,player.y+20);
    c.strokeStyle='#76c95e';c.lineWidth=3;c.beginPath();c.moveTo(-8,-13);c.lineTo(-13,-24);c.moveTo(8,-13);c.lineTo(13,-24);c.stroke();
    c.fillStyle='#d0ff91';c.beginPath();c.arc(-13,-24,4,0,7);c.arc(13,-24,4,0,7);c.fill();
    roundRect(-16,-18,32,35,13,'#a9ed75');
    c.fillStyle='#f8ffff';c.beginPath();c.ellipse(-7,-5,6,8,0,0,7);c.ellipse(7,-5,6,8,0,0,7);c.fill();
    c.fillStyle='#243955';c.beginPath();c.arc(-6,-4,2.8,0,7);c.arc(8,-4,2.8,0,7);c.fill();
    c.strokeStyle='#367753';c.lineWidth=1.8;c.beginPath();c.arc(1,6,5,.1,Math.PI-.1);c.stroke();
    c.fillStyle='#71c466';c.fillRect(-13,15,10,6);c.fillRect(4,15,10,6);
    c.restore();c.restore();
    if(!running&&ui.overlay.classList.contains('hidden'))say('Jeda');
  }
  function loop(now){
    const dt=last?Math.min(now-last,40):16.67;last=now;
    update(dt);draw();requestAnimationFrame(loop);
  }
  makeLevel();requestAnimationFrame(loop);
})();
</script>
