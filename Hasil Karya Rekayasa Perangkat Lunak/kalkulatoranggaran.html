<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Anggaran Sederhana</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #4a90e2;
            min-height: 100%;
            color: #333;
        }

        html {
            height: 100%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            margin: 10px 0 0 0;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .card-amount {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }

        .balance-card .card-amount {
            color: #4f46e5;
        }

        .income-card .card-amount {
            color: #10b981;
        }

        .expense-card .card-amount {
            color: #ef4444;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }

        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-section h2 {
            margin: 0 0 25px 0;
            color: #333;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .transactions-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .transactions-header h2 {
            margin: 0;
            color: #333;
            font-size: 1.5rem;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .transaction-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f3f4f6;
            transition: background-color 0.2s ease;
        }

        .transaction-item:hover {
            background-color: #f9fafb;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-description {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .transaction-date {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .transaction-amount {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .transaction-amount.income {
            color: #10b981;
        }

        .transaction-amount.expense {
            color: #ef4444;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .budget-chart {
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #374151;
        }

        .chart-bar {
            display: flex;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .chart-income {
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.5s ease;
        }

        .chart-expense {
            background: linear-gradient(90deg, #ef4444, #dc2626);
            transition: width 0.5s ease;
        }

        .chart-legend {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-income {
            background: #10b981;
        }

        .legend-expense {
            background: #ef4444;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .filter-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Kalkulator Anggaran</h1>
            <p>Kelola keuangan pribadi Anda dengan mudah</p>
        </div>

        <div class="dashboard">
            <div class="card balance-card">
                <div class="card-title">Saldo Total</div>
                <div class="card-amount" id="totalBalance">Rp 0</div>
            </div>
            <div class="card income-card">
                <div class="card-title">Total Pendapatan</div>
                <div class="card-amount" id="totalIncome">Rp 0</div>
            </div>
            <div class="card expense-card">
                <div class="card-title">Total Pengeluaran</div>
                <div class="card-amount" id="totalExpense">Rp 0</div>
            </div>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2>Tambah Transaksi</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="description">Deskripsi</label>
                        <input type="text" id="description" placeholder="Contoh: Gaji bulanan, Makan siang" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Jenis Transaksi</label>
                        <select id="type" required>
                            <option value="">Pilih jenis</option>
                            <option value="income">Pendapatan</option>
                            <option value="expense">Pengeluaran</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Tambah Transaksi</button>
                </form>

                <div class="budget-chart">
                    <div class="chart-title">Visualisasi Anggaran</div>
                    <div class="chart-bar">
                        <div class="chart-income" id="incomeBar"></div>
                        <div class="chart-expense" id="expenseBar"></div>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-color legend-income"></div>
                            <span>Pendapatan</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color legend-expense"></div>
                            <span>Pengeluaran</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="transactions-section">
                <div class="transactions-header">
                    <h2>Riwayat Transaksi</h2>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">Semua</button>
                        <button class="filter-btn" data-filter="income">Pendapatan</button>
                        <button class="filter-btn" data-filter="expense">Pengeluaran</button>
                    </div>
                </div>
                <div class="transaction-list" id="transactionList">
                    <div class="empty-state">
                        <p>Belum ada transaksi. Mulai tambahkan transaksi pertama Anda!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class BudgetTracker {
            constructor() {
                this.transactions = this.loadTransactions();
                this.currentFilter = 'all';
                this.initEventListeners();
                this.updateDisplay();
            }

            initEventListeners() {
                // Form submission
                document.getElementById('transactionForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addTransaction();
                });

                // Filter buttons
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });
            }

            addTransaction() {
                const description = document.getElementById('description').value.trim();
                const amount = parseFloat(document.getElementById('amount').value);
                const type = document.getElementById('type').value;

                if (!description || !amount || !type) {
                    alert('Mohon lengkapi semua field!');
                    return;
                }

                const transaction = {
                    id: Date.now(),
                    description,
                    amount,
                    type,
                    date: new Date().toLocaleDateString('id-ID')
                };

                this.transactions.unshift(transaction);
                this.saveTransactions();
                this.updateDisplay();
                this.clearForm();
            }

            deleteTransaction(id) {
                if (confirm('Yakin ingin menghapus transaksi ini?')) {
                    this.transactions = this.transactions.filter(t => t.id !== id);
                    this.saveTransactions();
                    this.updateDisplay();
                }
            }

            setFilter(filter) {
                this.currentFilter = filter;
                
                // Update active button
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
                
                this.displayTransactions();
            }

            updateDisplay() {
                this.updateSummary();
                this.displayTransactions();
                this.updateChart();
            }

            updateSummary() {
                const income = this.transactions
                    .filter(t => t.type === 'income')
                    .reduce((sum, t) => sum + t.amount, 0);
                
                const expense = this.transactions
                    .filter(t => t.type === 'expense')
                    .reduce((sum, t) => sum + t.amount, 0);
                
                const balance = income - expense;

                document.getElementById('totalIncome').textContent = this.formatCurrency(income);
                document.getElementById('totalExpense').textContent = this.formatCurrency(expense);
                document.getElementById('totalBalance').textContent = this.formatCurrency(balance);

                // Update balance color based on positive/negative
                const balanceElement = document.getElementById('totalBalance');
                balanceElement.style.color = balance >= 0 ? '#10b981' : '#ef4444';
            }

            displayTransactions() {
                const listElement = document.getElementById('transactionList');
                
                let filteredTransactions = this.transactions;
                if (this.currentFilter !== 'all') {
                    filteredTransactions = this.transactions.filter(t => t.type === this.currentFilter);
                }

                if (filteredTransactions.length === 0) {
                    listElement.innerHTML = `
                        <div class="empty-state">
                            <p>${this.currentFilter === 'all' ? 
                                'Belum ada transaksi. Mulai tambahkan transaksi pertama Anda!' : 
                                `Belum ada ${this.currentFilter === 'income' ? 'pendapatan' : 'pengeluaran'}.`
                            }</p>
                        </div>
                    `;
                    return;
                }

                listElement.innerHTML = filteredTransactions.map(transaction => `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-description">${transaction.description}</div>
                            <div class="transaction-date">${transaction.date}</div>
                        </div>
                        <div class="transaction-amount ${transaction.type}">
                            ${transaction.type === 'income' ? '+' : '-'}${this.formatCurrency(transaction.amount)}
                        </div>
                        <button class="delete-btn" onclick="budgetTracker.deleteTransaction(${transaction.id})">
                            Hapus
                        </button>
                    </div>
                `).join('');
            }

            updateChart() {
                const income = this.transactions
                    .filter(t => t.type === 'income')
                    .reduce((sum, t) => sum + t.amount, 0);
                
                const expense = this.transactions
                    .filter(t => t.type === 'expense')
                    .reduce((sum, t) => sum + t.amount, 0);

                const total = income + expense;
                
                if (total === 0) {
                    document.getElementById('incomeBar').style.width = '0%';
                    document.getElementById('expenseBar').style.width = '0%';
                    return;
                }

                const incomePercentage = (income / total) * 100;
                const expensePercentage = (expense / total) * 100;

                document.getElementById('incomeBar').style.width = `${incomePercentage}%`;
                document.getElementById('expenseBar').style.width = `${expensePercentage}%`;
            }

            clearForm() {
                document.getElementById('transactionForm').reset();
            }

            formatCurrency(amount) {
                return new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0
                }).format(amount);
            }

            saveTransactions() {
                localStorage.setItem('budgetTransactions', JSON.stringify(this.transactions));
            }

            loadTransactions() {
                const saved = localStorage.getItem('budgetTransactions');
                return saved ? JSON.parse(saved) : [];
            }
        }

        // Initialize the budget tracker
        const budgetTracker = new BudgetTracker();
    </script>

</html>
