<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Canva Code</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            color: white;
        }

        html {
            height: 100%;
        }

        .game-container {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin: 20px;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
        }

        canvas {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: block;
            margin: 0 auto 20px auto;
        }

        .controls {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.6;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .game-over h2 {
            color: #ff6b6b;
            margin: 0 0 20px 0;
            font-size: 2rem;
        }

        .restart-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        @media (max-width: 600px) {
            canvas {
                width: 90vw;
                height: 90vw;
                max-width: 400px;
                max-height: 400px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .game-container {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        
        <div class="score-board">
            <div class="score">Skor: <span id="score">0</span></div>
            <div class="score">Skor Tertinggi: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls">
            <div>🎮 Gunakan tombol panah untuk menggerakkan ular</div>
            <div>🍎 Makan makanan untuk tumbuh dan mendapat poin</div>
            <div>⚠️ Jangan menabrak dinding atau tubuh sendiri!</div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Skor Akhir: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">🔄 Main Lagi</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // Game variables
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = true;

        // Initialize high score display
        highScoreElement.textContent = highScore;

        // Generate random food position
        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        // Draw game elements
        function drawGame() {
            // Clear canvas with gradient background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0f3460');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            ctx.fillStyle = '#4CAF50';
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Snake head - brighter green
                    ctx.fillStyle = '#66BB6A';
                } else {
                    // Snake body - gradient effect
                    ctx.fillStyle = `rgba(76, 175, 80, ${1 - index * 0.1})`;
                }
                
                ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
                
                // Add some shine effect
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, gridSize - 12, 4);
            });

            // Draw food with pulsing effect
            const time = Date.now() * 0.005;
            const pulse = Math.sin(time) * 0.1 + 0.9;
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, (gridSize - 4) * pulse, (gridSize - 4) * pulse);
            
            // Food highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillRect(food.x * gridSize + 6, food.y * gridSize + 6, 8, 8);
        }

        // Move snake
        function moveSnake() {
            if (!gameRunning) return;

            // Process input queue
            if (inputQueue.length > 0) {
                const nextDirection = inputQueue.shift();
                dx = nextDirection.dx;
                dy = nextDirection.dy;
                lastDirection = {dx, dy};
            }

            // Only move if there's a direction set
            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision (exclude tail if not eating)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                // Update high score
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                randomFood();
                
                // Add visual feedback for eating
                canvas.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    canvas.style.transform = 'scale(1)';
                }, 100);
            } else {
                snake.pop();
            }
        }

        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
            
            // Add shake effect
            canvas.style.animation = 'shake 0.5s ease-in-out';
            setTimeout(() => {
                canvas.style.animation = '';
            }, 500);
        }

        // Restart game
        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            lastDirection = {dx: 0, dy: 0};
            inputQueue = [];
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverElement.style.display = 'none';
            randomFood();
        }

        // Handle keyboard input with direction queue
        let inputQueue = [];
        let lastDirection = {dx: 0, dy: 0};

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            const key = e.key;
            let newDirection = null;
            
            // Prevent reverse direction and queue input
            if (key === 'ArrowLeft' && lastDirection.dx !== 1) {
                newDirection = {dx: -1, dy: 0};
            } else if (key === 'ArrowUp' && lastDirection.dy !== 1) {
                newDirection = {dx: 0, dy: -1};
            } else if (key === 'ArrowRight' && lastDirection.dx !== -1) {
                newDirection = {dx: 1, dy: 0};
            } else if (key === 'ArrowDown' && lastDirection.dy !== -1) {
                newDirection = {dx: 0, dy: 1};
            }

            // Add to queue if valid and different from current direction
            if (newDirection && (newDirection.dx !== dx || newDirection.dy !== dy)) {
                if (inputQueue.length === 0 || 
                    (inputQueue[inputQueue.length - 1].dx !== newDirection.dx || 
                     inputQueue[inputQueue.length - 1].dy !== newDirection.dy)) {
                    inputQueue.push(newDirection);
                }
            }
        });

        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!gameRunning) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            let newDirection = null;
            
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (deltaX > 30 && lastDirection.dx !== -1) {
                    newDirection = {dx: 1, dy: 0};
                } else if (deltaX < -30 && lastDirection.dx !== 1) {
                    newDirection = {dx: -1, dy: 0};
                }
            } else {
                // Vertical swipe
                if (deltaY > 30 && lastDirection.dy !== -1) {
                    newDirection = {dx: 0, dy: 1};
                } else if (deltaY < -30 && lastDirection.dy !== 1) {
                    newDirection = {dx: 0, dy: -1};
                }
            }

            // Add to queue if valid
            if (newDirection && (newDirection.dx !== dx || newDirection.dy !== dy)) {
                if (inputQueue.length === 0 || 
                    (inputQueue[inputQueue.length - 1].dx !== newDirection.dx || 
                     inputQueue[inputQueue.length - 1].dy !== newDirection.dy)) {
                    inputQueue.push(newDirection);
                }
            }
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            canvas {
                transition: transform 0.1s ease;
            }
        `;
        document.head.appendChild(style);

        // Game loop
        function gameLoop() {
            moveSnake();
            drawGame();
        }

        // Initialize game
        randomFood();
        setInterval(gameLoop, 150); // Game speed - lower number = faster
    </script>
