        }

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

        .pulse-slow {
            animation: pulse 3s infinite;
        }
        
        .menu-item {
            transition: all 0.3s ease;

        .menu-item:hover {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            transform: scale(1.05);

        .code-block {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 15px;
            padding: 20px;
            color: white;
            font-family: 'Courier New', monospace;
            position: relative;

            right: 0;
            height: 30px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);

        // Initialize the application
        function init() {
            populateNavigation();
            showContent('intro');
            setupEventListeners();

        // Populate navigation menus
        function populateNavigation() {
            const mobileNav = document.getElementById('mobileNavigation');
            const desktopNav = document.getElementById('desktopNavigation');
            
            menuItems.forEach((item, index) => {
                const mobileItem = createMenuItem(item, index, true);
                const desktopItem = createMenuItem(item, index, false);
                
                mobileNav.appendChild(mobileItem);
                desktopNav.appendChild(desktopItem);
            });
        }

        // Create menu item
        function createMenuItem(item, index, isMobile) {
            const menuItem = document.createElement('div');
            menuItem.className = `menu-item p-3 rounded-xl cursor-pointer text-sm ${isMobile ? 'text-gray-700' : 'text-gray-600'} hover:text-white`;
            menuItem.innerHTML = `
                <div class="flex items-center">
                    <span class="text-lg mr-2">${item.icon}</span>
                    <span class="font-medium">${item.title}</span>
                </div>
            `;
            
            menuItem.addEventListener('click', () => {
                showContent(item.id);
                currentMenuIndex = index;
                updateNextButton();
                if (isMobile) {
                    document.getElementById('mobileMenu').classList.add('hidden');
                }
                scrollToTop();
            });
            
            return menuItem;
        }

        // Show content based on menu selection
        function showContent(contentId) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = content[contentId] || '<p>Konten tidak ditemukan.</p>';
            contentDiv.className = 'bg-white rounded-3xl shadow-2xl p-6 md:p-8 fade-in';
            
            // Update active menu
            updateActiveMenu(contentId);
            
            // Initialize quiz if needed
            if (contentId === 'kuis') {
                resetQuiz();
            }
        }

        // Update active menu styling
        function updateActiveMenu(activeId) {
            const allMenuItems = document.querySelectorAll('.menu-item');
            allMenuItems.forEach((item, index) => {
                if (menuItems[index].id === activeId) {
                    item.style.background = 'linear-gradient(45deg, #667eea, #764ba2)';
                    item.style.color = 'white';
                    item.style.transform = 'scale(1.05)';
                } else {
                    item.style.background = '';
                    item.style.color = '';
                    item.style.transform = '';
                }
            });
        }

        // Update next button visibility and functionality
        function updateNextButton() {
            const nextBtn = document.getElementById('nextBtn');
            if (currentMenuIndex < menuItems.length - 1) {
                nextBtn.classList.remove('hidden');
                nextBtn.onclick = () => {
                    currentMenuIndex++;
                    showContent(menuItems[currentMenuIndex].id);
                    updateNextButton();
                    scrollToTop();
                };
            } else {
                nextBtn.classList.add('hidden');
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Mobile menu toggle
            document.getElementById('menuToggle').addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.remove('hidden');
            });
            
            document.getElementById('closeMenu').addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.add('hidden');
            });
            
            // Back to top button
            const backToTopBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    backToTopBtn.classList.remove('hidden');
                } else {
                    backToTopBtn.classList.add('hidden');
                }
            });
            
            backToTopBtn.addEventListener('click', scrollToTop);
        }

        // Scroll to top function
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

            const nameInput = document.getElementById('studentNameInput');

                return;

            studentName = nameInput.value.trim();

            score = 0;
            showQuestion();

        function showQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('currentScore').textContent = score;
            document.getElementById('questionText').textContent = question.question;
            
            const progressPercent = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            document.getElementById('progressBar').style.width = progressPercent + '%';
            
            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';
            
            question.answers.forEach((answer, index) => {
                const answerDiv = document.createElement('div');
                answerDiv.className = 'p-4 bg-white rounded-xl cursor-pointer hover:bg-blue-50 transition-all duration-300 border-2 border-transparent hover:border-blue-200';
                answerDiv.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center mr-3 font-bold text-blue-600">
                            ${String.fromCharCode(65 + index)}
                        </span>
                        <span>${answer}</span>
                    </div>
                `;
                
                answerDiv.addEventListener('click', () => selectAnswer(index, answerDiv));
                answersContainer.appendChild(answerDiv);
            });
            
            document.getElementById('nextButton').classList.add('hidden');
        }

        function selectAnswer(selectedIndex, selectedDiv) {
            const question = quizQuestions[currentQuestionIndex];
            const allAnswers = document.querySelectorAll('#answersContainer > div');
            
            // Disable all answers
            allAnswers.forEach(div => {
                div.style.pointerEvents = 'none';
            });
            
            // Show correct/incorrect
            if (selectedIndex === question.correct) {
                selectedDiv.className = 'p-4 bg-green-100 rounded-xl border-2 border-green-500';
                selectedDiv.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center mr-3 font-bold text-white">
                            ✓
                        </span>
                        <span>${question.answers[selectedIndex]}</span>
                    </div>
                `;
                score++;
            } else {
                selectedDiv.className = 'p-4 bg-red-100 rounded-xl border-2 border-red-500';
                selectedDiv.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center mr-3 font-bold text-white">
                            ✗
                        </span>
                        <span>${question.answers[selectedIndex]}</span>
                    </div>
                `;
                
                // Show correct answer
                allAnswers[question.correct].className = 'p-4 bg-green-100 rounded-xl border-2 border-green-500';
                allAnswers[question.correct].innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center mr-3 font-bold text-white">
                            ✓
                        </span>
                        <span>${question.answers[question.correct]}</span>
                    </div>
                `;
            }
            
            document.getElementById('currentScore').textContent = score;
            document.getElementById('nextButton').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < quizQuestions.length) {
                showQuestion();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            document.getElementById('quizContent').classList.add('hidden');

                emoji = '💪';
                message = 'Tetap semangat! Ulangi materi dan coba lagi!';
            }
            
            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalMessage').textContent = message;
        }

        function restartQuiz() {
            resetQuiz();
        }

        function resetQuiz() {
            document.getElementById('quizResult').classList.add('hidden');
            document.getElementById('quizContent').classList.add('hidden');
            document.getElementById('nameForm').classList.remove('hidden');
            document.getElementById('studentNameInput').value = '';
            currentQuestionIndex = 0;
            score = 0;
        }

        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
