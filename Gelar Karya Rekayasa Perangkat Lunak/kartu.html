<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Nama Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        
        .card-preview {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: perspective(1000px) rotateY(-5deg);
            transition: all 0.3s ease;
        }
        
        .card-preview:hover {
            transform: perspective(1000px) rotateY(0deg) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }
        
        .form-input {
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .color-picker {
            width: 60px;
            height: 40px;
            border-radius: 8px;
            border: 3px solid white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .color-picker:hover {
            transform: scale(1.1);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body class="min-h-full bg-gradient-to-br from-purple-50 to-blue-50 font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-12 animate-fade-in">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">🎨 Generator Kartu Nama</h1>
            <p class="text-lg text-gray-600">Buat kartu nama profesional dengan pratinjau real-time</p>
        </div>

        <div class="grid lg:grid-cols-2 gap-12 max-w-6xl mx-auto">
            <!-- Form Input -->
            <div class="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
                    ✏️ Informasi Kartu
                </h2>
                
                <form class="space-y-6">
                    <!-- Nama -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
                        <input 
                            type="text" 
                            id="nama-input" 
                            placeholder="Masukkan nama Anda"
                            class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        >
                    </div>

                    <!-- Jabatan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Jabatan</label>
                        <input 
                            type="text" 
                            id="jabatan-input" 
                            placeholder="Contoh: UI/UX Designer"
                            class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        >
                    </div>

                    <!-- Perusahaan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Perusahaan</label>
                        <input 
                            type="text" 
                            id="perusahaan-input" 
                            placeholder="Nama perusahaan"
                            class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input 
                            type="email" 
                            id="email-input" 
                            placeholder="nama@email.com"
                            class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        >
                    </div>

                    <!-- Telepon -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Telepon</label>
                        <input 
                            type="tel" 
                            id="telepon-input" 
                            placeholder="+62 812-3456-7890"
                            class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        >
                    </div>

                    <!-- Warna Tema -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Warna Tema</label>
                        <div class="flex gap-3 flex-wrap">
                            <input type="color" id="warna1" value="#667eea" class="color-picker" title="Warna Utama">
                            <input type="color" id="warna2" value="#764ba2" class="color-picker" title="Warna Sekunder">
                        </div>
                        <p class="text-xs text-gray-500 mt-2">Pilih dua warna untuk gradien latar belakang</p>
                    </div>

                    <!-- Ukuran Font -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ukuran Font Nama</label>
                        <input 
                            type="range" 
                            id="font-size" 
                            min="20" 
                            max="40" 
                            value="28"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                        >
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span>Kecil</span>
                            <span>Besar</span>
                        </div>
                    </div>
                </form>

                <!-- Tombol Download -->
                <div class="mt-8 pt-6 border-t border-gray-200">
                    <button 
                        onclick="downloadCard()" 
                        class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all duration-300 transform hover:scale-105 shadow-lg"
                    >
                        📥 Download Kartu Nama
                    </button>
                </div>
            </div>

            <!-- Preview Kartu -->
            <div class="flex items-center justify-center animate-fade-in">
                <div class="bg-white p-8 rounded-2xl shadow-xl">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center flex items-center justify-center">
                        👁️ Pratinjau Real-Time
                    </h2>
                    
                    <!-- Kartu Nama -->
                    <div id="kartu-preview" class="card-preview w-80 h-48 rounded-xl p-6 text-white relative overflow-hidden">
                        <!-- Dekorasi -->
                        <div class="absolute top-0 right-0 w-32 h-32 bg-white bg-opacity-10 rounded-full -mr-16 -mt-16"></div>
                        <div class="absolute bottom-0 left-0 w-24 h-24 bg-white bg-opacity-5 rounded-full -ml-12 -mb-12"></div>
                        
                        <!-- Konten Kartu -->
                        <div class="relative z-10 h-full flex flex-col justify-between">
                            <div>
                                <h3 id="nama-preview" class="font-bold text-white mb-1" style="font-size: 28px;">Nama Anda</h3>
                                <p id="jabatan-preview" class="text-white text-opacity-90 text-sm font-medium">Jabatan Anda</p>
                                <p id="perusahaan-preview" class="text-white text-opacity-80 text-xs mt-1">Perusahaan</p>
                            </div>
                            
                            <div class="text-xs text-white text-opacity-90 space-y-1">
                                <div class="flex items-center">
                                    <span class="mr-2">📧</span>
                                    <span id="email-preview">email@contoh.com</span>
                                </div>
                                <div class="flex items-center">
                                    <span class="mr-2">📱</span>
                                    <span id="telepon-preview">+62 812-3456-7890</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <p class="text-center text-gray-500 text-sm mt-4">Kartu akan berubah saat Anda mengetik ✨</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fungsi untuk update pratinjau real-time
        function updatePreview() {
            // Update teks
            const nama = document.getElementById('nama-input').value || 'Nama Anda';
            const jabatan = document.getElementById('jabatan-input').value || 'Jabatan Anda';
            const perusahaan = document.getElementById('perusahaan-input').value || 'Perusahaan';
            const email = document.getElementById('email-input').value || 'email@contoh.com';
            const telepon = document.getElementById('telepon-input').value || '+62 812-3456-7890';
            
            document.getElementById('nama-preview').textContent = nama;
            document.getElementById('jabatan-preview').textContent = jabatan;
            document.getElementById('perusahaan-preview').textContent = perusahaan;
            document.getElementById('email-preview').textContent = email;
            document.getElementById('telepon-preview').textContent = telepon;
            
            // Update warna gradien
            const warna1 = document.getElementById('warna1').value;
            const warna2 = document.getElementById('warna2').value;
            const kartu = document.getElementById('kartu-preview');
            kartu.style.background = `linear-gradient(135deg, ${warna1} 0%, ${warna2} 100%)`;
            
            // Update ukuran font nama
            const fontSize = document.getElementById('font-size').value;
            document.getElementById('nama-preview').style.fontSize = fontSize + 'px';
        }

        // Event listeners untuk semua input
        document.getElementById('nama-input').addEventListener('input', updatePreview);
        document.getElementById('jabatan-input').addEventListener('input', updatePreview);
        document.getElementById('perusahaan-input').addEventListener('input', updatePreview);
        document.getElementById('email-input').addEventListener('input', updatePreview);
        document.getElementById('telepon-input').addEventListener('input', updatePreview);
        document.getElementById('warna1').addEventListener('input', updatePreview);
        document.getElementById('warna2').addEventListener('input', updatePreview);
        document.getElementById('font-size').addEventListener('input', updatePreview);

        // Fungsi download kartu (simulasi)
        function downloadCard() {
            // Buat canvas untuk menggambar kartu
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Set ukuran canvas (kartu nama standar: 3.5" x 2" = 350px x 200px)
            canvas.width = 350;
            canvas.height = 200;
            
            // Ambil warna gradien
            const warna1 = document.getElementById('warna1').value;
            const warna2 = document.getElementById('warna2').value;
            
            // Buat gradien
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, warna1);
            gradient.addColorStop(1, warna2);
            
            // Gambar latar belakang
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Set font dan warna teks
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            
            // Gambar nama
            const fontSize = document.getElementById('font-size').value;
            ctx.font = `bold ${Math.floor(fontSize * 0.8)}px Arial`;
            ctx.fillText(document.getElementById('nama-input').value || 'Nama Anda', 30, 60);
            
            // Gambar jabatan
            ctx.font = '14px Arial';
            ctx.fillText(document.getElementById('jabatan-input').value || 'Jabatan Anda', 30, 85);
            
            // Gambar perusahaan
            ctx.font = '12px Arial';
            ctx.fillText(document.getElementById('perusahaan-input').value || 'Perusahaan', 30, 105);
            
            // Gambar email
            ctx.font = '11px Arial';
            ctx.fillText('📧 ' + (document.getElementById('email-input').value || 'email@contoh.com'), 30, 140);
            
            // Gambar telepon
            ctx.fillText('📱 ' + (document.getElementById('telepon-input').value || '+62 812-3456-7890'), 30, 160);
            
            // Download gambar
            const link = document.createElement('a');
            link.download = 'kartu-nama.png';
            link.href = canvas.toDataURL();
            link.click();
            
            // Tampilkan notifikasi
            alert('🎉 Kartu nama berhasil didownload!');
        }

        // Inisialisasi pratinjau saat halaman dimuat
        document.addEventListener('DOMContentLoaded', updatePreview);
    </script>

</html>
