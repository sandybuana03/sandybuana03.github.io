    <script>
        // Color Theme System
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function generateColorShades(baseColor) {
            const rgb = hexToRgb(baseColor);
            if (!rgb) return null;

            // Generate different shades based on the base color
            const shades = {
                50: `${Math.min(255, rgb.r + 60)}, ${Math.min(255, rgb.g + 60)}, ${Math.min(255, rgb.b + 60)}`,
                100: `${Math.min(255, rgb.r + 40)}, ${Math.min(255, rgb.g + 40)}, ${Math.min(255, rgb.b + 40)}`,
                200: `${Math.min(255, rgb.r + 20)}, ${Math.min(255, rgb.g + 20)}, ${Math.min(255, rgb.b + 20)}`,
                300: `${Math.min(255, rgb.r + 10)}, ${Math.min(255, rgb.g + 10)}, ${Math.min(255, rgb.b + 10)}`,
                400: `${Math.min(255, rgb.r + 5)}, ${Math.min(255, rgb.g + 5)}, ${Math.min(255, rgb.b + 5)}`,
                500: `${rgb.r}, ${rgb.g}, ${rgb.b}`,
                600: `${Math.max(0, rgb.r - 20)}, ${Math.max(0, rgb.g - 20)}, ${Math.max(0, rgb.b - 20)}`,
                700: `${Math.max(0, rgb.r - 40)}, ${Math.max(0, rgb.g - 40)}, ${Math.max(0, rgb.b - 40)}`,
                800: `${Math.max(0, rgb.r - 60)}, ${Math.max(0, rgb.g - 60)}, ${Math.max(0, rgb.b - 60)}`,
                900: `${Math.max(0, rgb.r - 80)}, ${Math.max(0, rgb.g - 80)}, ${Math.max(0, rgb.b - 80)}`
            };

            return shades;
        }

        function applyThemeColor(color) {
            const shades = generateColorShades(color);
            if (!shades) return;

            const root = document.documentElement;
            root.style.setProperty('--theme-color', shades[500]);
            root.style.setProperty('--theme-50', shades[50]);
            root.style.setProperty('--theme-100', shades[100]);
            root.style.setProperty('--theme-200', shades[200]);
            root.style.setProperty('--theme-300', shades[300]);
            root.style.setProperty('--theme-400', shades[400]);
            root.style.setProperty('--theme-500', shades[500]);
            root.style.setProperty('--theme-600', shades[600]);
            root.style.setProperty('--theme-700', shades[700]);
            root.style.setProperty('--theme-800', shades[800]);
            root.style.setProperty('--theme-900', shades[900]);

            // Save to localStorage
            localStorage.setItem('themeColor', color);
        }

        // File structure configuration - Update this with your actual files and folders
        const fileStructure = {
            '.': {

            },

        // Cache untuk menyimpan ukuran file yang sudah dideteksi
        const fileSizeCache = new Map();

        // Fungsi untuk mendeteksi ukuran file secara otomatis
        async function detectFileSize(filePath) {
            // Cek cache terlebih dahulu
            if (fileSizeCache.has(filePath)) {
                return fileSizeCache.get(filePath);
            }

            try {
                const response = await fetch(filePath, { method: 'HEAD' });
                if (response.ok) {
                    const contentLength = response.headers.get('Content-Length');
                    if (contentLength) {
                        const size = parseInt(contentLength);
                        fileSizeCache.set(filePath, size);
                        return size;
                    }
                }
            } catch (error) {
                console.log(`Tidak dapat mendeteksi ukuran file: ${filePath}`);
            }

            // Fallback: coba dengan fetch biasa untuk mendapatkan ukuran
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const blob = await response.blob();
                    const size = blob.size;
                    fileSizeCache.set(filePath, size);
                    return size;
                }
            } catch (error) {
                console.log(`Fallback gagal untuk: ${filePath}`);
            }

            return null;
        }

        // Get file extension and icon
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = {
                'html': '🌐',
                'css': '🎨',
                'js': '⚡',
                'json': '📋',
                'md': '📝',
                'txt': '📄',
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'xls': '📗',
                'xlsx': '📗',
                'ppt': '📙',
                'pptx': '📙',
                'zip': '📦',
                'rar': '📦',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'svg': '🖼️',
                'mp4': '🎬',
                'avi': '🎬',
                'mp3': '🎵',
                'wav': '🎵'
            };
            return iconMap[ext] || '📄';
        }
