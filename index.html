<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buana Explorer - SMK AL-IRSYAD TEGAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'islamic-green': {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .glow-effect {
            box-shadow: 0 0 30px rgba(var(--theme-color), 0.4), 0 0 60px rgba(var(--theme-color), 0.2);
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 30px rgba(var(--theme-color), 0.4), 0 0 60px rgba(var(--theme-color), 0.2); }
            100% { box-shadow: 0 0 40px rgba(var(--theme-color), 0.6), 0 0 80px rgba(var(--theme-color), 0.3); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .file-item {
            position: relative;
            overflow: hidden;
        }
        
        .file-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(var(--theme-color), 0.08), transparent);
            transition: left 0.5s ease;
            z-index: 1;
        }
        
        .file-item:hover::after {
            left: 100%;
        }
        
        .file-item:hover {
            transform: translateY(-6px) scale(1.01);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(var(--theme-color), 0.12), 0 10px 25px rgba(0, 0, 0, 0.08);
            border-color: rgb(var(--theme-300));
        }
        
        .dark .file-item:hover {
            box-shadow: 0 15px 35px rgba(var(--theme-color), 0.15), 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgb(var(--theme-500));
        }
        
        .file-item .file-icon {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            position: relative;
        }
        
        .file-item:hover .file-icon {
            transform: scale(1.15) rotate(3deg);
        }
        
        .search-glow:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1), 0 0 20px rgba(34, 197, 94, 0.2);
        }
        
        /* Dynamic Color Variables */
        :root {
            --theme-color: 6, 182, 212;
            --theme-50: 236, 254, 255;
            --theme-100: 207, 250, 254;
            --theme-200: 165, 243, 252;
            --theme-300: 103, 232, 249;
            --theme-400: 34, 211, 238;
            --theme-500: 6, 182, 212;
            --theme-600: 8, 145, 178;
            --theme-700: 14, 116, 144;
            --theme-800: 21, 94, 117;
            --theme-900: 22, 78, 99;
        }
        
        /* Dynamic Theme Classes */
        .theme-bg-50 { background-color: rgb(var(--theme-50)); }
        .theme-bg-100 { background-color: rgb(var(--theme-100)); }
        .theme-bg-200 { background-color: rgb(var(--theme-200)); }
        .theme-bg-500 { background-color: rgb(var(--theme-500)); }
        .theme-bg-600 { background-color: rgb(var(--theme-600)); }
        .theme-bg-700 { background-color: rgb(var(--theme-700)); }
        .theme-bg-800 { background-color: rgb(var(--theme-800)); }
        .theme-bg-900 { background-color: rgb(var(--theme-900)); }
        
        .theme-text-50 { color: rgb(var(--theme-50)); }
        .theme-text-100 { color: rgb(var(--theme-100)); }
        .theme-text-200 { color: rgb(var(--theme-200)); }
        .theme-text-300 { color: rgb(var(--theme-300)); }
        .theme-text-400 { color: rgb(var(--theme-400)); }
        .theme-text-500 { color: rgb(var(--theme-500)); }
        .theme-text-600 { color: rgb(var(--theme-600)); }
        .theme-text-700 { color: rgb(var(--theme-700)); }
        .theme-text-800 { color: rgb(var(--theme-800)); }
        
        .theme-border-100 { border-color: rgb(var(--theme-100)); }
        .theme-border-200 { border-color: rgb(var(--theme-200)); }
        .theme-border-700 { border-color: rgb(var(--theme-700)); }
        .theme-border-800 { border-color: rgb(var(--theme-800)); }
        
        .theme-glow {
            box-shadow: 0 0 20px rgba(var(--theme-color), 0.3);
        }
        
        .theme-search-glow:focus {
            box-shadow: 0 0 0 4px rgba(var(--theme-color), 0.15), 0 0 30px rgba(var(--theme-color), 0.3), 0 10px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px) scale(1.02);
        }
        
        .theme-hover-bg-200:hover { 
            background-color: rgb(var(--theme-200)); 
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(var(--theme-color), 0.15);
        }
        .theme-hover-bg-700:hover { 
            background-color: rgb(var(--theme-700)); 
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(var(--theme-color), 0.2);
        }
        .theme-hover-bg-900-10:hover { 
            background-color: rgba(var(--theme-900), 0.1); 
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(var(--theme-color), 0.1);
        }
        
        /* View Mode Styles */
        .view-mode-btn {
            color: #6b7280;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        .view-mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .view-mode-btn:hover::before {
            left: 100%;
        }
        
        .view-mode-btn.active {
            background-color: rgb(var(--theme-500));
            color: white;
            box-shadow: 0 4px 15px rgba(var(--theme-color), 0.3);
            transform: scale(1.05);
        }
        
        .view-mode-btn:not(.active):hover {
            background-color: rgba(var(--theme-500), 0.1);
            color: rgb(var(--theme-600));
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(var(--theme-color), 0.15);
        }
        
        /* Grid View Styles */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        .grid-item {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgb(var(--theme-100));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        .dark .grid-item {
            background: #374151;
            border-color: rgb(var(--theme-800));
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .grid-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(var(--theme-color), 0.1), transparent);
            transition: left 0.6s ease;
        }
        
        .grid-item:hover::before {
            left: 100%;
        }
        
        .grid-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(var(--theme-color), 0.15), 0 15px 30px rgba(0, 0, 0, 0.1);
            border-color: rgb(var(--theme-400));
        }
        
        .dark .grid-item:hover {
            box-shadow: 0 20px 40px rgba(var(--theme-color), 0.2), 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: rgb(var(--theme-500));
        }
        
        .grid-item .file-icon {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }
        
        .grid-item:hover .file-icon {
            transform: scale(1.15) rotate(5deg);
        }
        
        .grid-item .folder-icon {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .grid-item:hover .folder-icon {
            transform: scale(1.1) rotate(3deg);
        }
        
        /* Snow/Bubble Animation */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            font-size: 1em;
            animation: snowfall linear infinite;
            user-select: none;
        }
        
        /* Snow mode (dark theme) */
        .dark .snowflake {
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* Bubble mode (light theme) */
        .snowflake {
            color: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(59, 130, 246, 0.2);
            width: 1em;
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        
        .dark .snowflake {
            background: none;
            border: none;
            box-shadow: none;
            width: auto;
            height: auto;
            display: block;
        }
        
        @keyframes snowfall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Different snowflake/bubble sizes and speeds */
        .snowflake:nth-child(odd) {
            animation-duration: 10s;
            font-size: 0.8em;
        }
        
        .snowflake:nth-child(even) {
            animation-duration: 15s;
            font-size: 1.2em;
        }
        
        .snowflake:nth-child(3n) {
            animation-duration: 12s;
            font-size: 0.6em;
        }
        
        .snowflake:nth-child(4n) {
            animation-duration: 18s;
            font-size: 1.4em;
        }
        
        .snowflake:nth-child(5n) {
            animation-duration: 8s;
            font-size: 0.9em;
        }
        
        /* Snow control button */
        .snow-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: #6b7280;
        }
        
        .dark .snow-toggle {
            background: rgba(55, 65, 81, 0.9);
            border-color: rgba(255, 255, 255, 0.1);
            color: #9ca3af;
        }
        
        .snow-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.2);
            background: rgba(var(--theme-500), 0.1);
            border-color: rgba(var(--theme-color), 0.3);
            color: rgb(var(--theme-600));
        }
        
        .dark .snow-toggle:hover {
            background: rgba(var(--theme-500), 0.15);
            border-color: rgba(var(--theme-color), 0.4);
            color: rgb(var(--theme-400));
        }
        
        .snow-toggle.active {
            background: rgba(var(--theme-500), 0.9);
            color: white;
            border-color: rgba(var(--theme-color), 0.6);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.3);
        }
        
        .dark .snow-toggle.active {
            background: rgba(var(--theme-600), 0.9);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.4);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen transition-all duration-300">
    <!-- Snow Animation Container -->
    <div id="snowContainer" class="snow-container hidden"></div>
    
    <!-- Snow/Bubble Toggle Button -->
    <button id="snowToggle" class="snow-toggle" title="Toggle Animasi Salju/Bubble">
        <!-- Snow icon for dark mode -->
        <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L13.09 8.26L19 7L14.74 12L19 17L13.09 15.74L12 22L10.91 15.74L5 17L9.26 12L5 7L10.91 8.26L12 2Z"></path>
        </svg>
        <!-- Bubble icon for light mode -->
        <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <circle cx="6" cy="6" r="2"></circle>
            <circle cx="18" cy="6" r="2"></circle>
            <circle cx="6" cy="18" r="2"></circle>
            <circle cx="18" cy="18" r="2"></circle>
        </svg>
    </button>
    <!-- Header with Integrated Breadcrumb -->
    <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b theme-border-200 dark:theme-border-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center theme-glow" style="background: linear-gradient(135deg, rgb(var(--theme-500)), rgb(var(--theme-600)))">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Buana Explorer</h1>
                        <p class="text-sm theme-text-600 dark:theme-text-400 font-medium">SMK AL-IRSYAD TEGAL</p>
                    </div>
                </div>
                
                <!-- Theme Controls -->
                <div class="flex items-center space-x-2">
                    <!-- Color Picker Button -->
                    <div class="relative">
                        <button 
                            id="colorPickerBtn"
                            class="p-2 theme-bg-100 dark:theme-bg-800 theme-text-600 dark:theme-text-300 rounded-xl theme-hover-bg-200 dark:theme-hover-bg-700 transition-all duration-300"
                            title="Pilih Warna Tema"
                        >
                            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zM7 3H5a2 2 0 00-2 2v12a4 4 0 004 4h2M9 3h10a2 2 0 012 2v12a4 4 0 01-2 2H9"></path>
                            </svg>
                        </button>
                        
                        <!-- Color Picker Dropdown -->
                        <div id="colorPickerDropdown" class="absolute right-0 top-12 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 p-4 w-64 hidden z-50">
                            <div class="mb-3">
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Pilih Warna Tema:</label>
                                <input type="color" id="colorPicker" value="#06b6d4" class="w-full h-10 rounded-lg border border-gray-300 dark:border-gray-600 cursor-pointer">
                            </div>
                            
                            <!-- Preset Colors -->
                            <div class="mb-3">
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Warna Preset:</label>
                                <div class="grid grid-cols-6 gap-2">
                                    <button class="preset-color w-8 h-8 rounded-lg border-2 border-gray-300 hover:scale-110 transition-transform" style="background-color: #22c55e" data-color="#22c55e" title="Hijau"></button>
                                    <button class="preset-color w-8 h-8 rounded-lg border-2 border-gray-300 hover:scale-110 transition-transform" style="background-color: #3b82f6" data-color="#3b82f6" title="Biru"></button>
                                    <button class="preset-color w-8 h-8 rounded-lg border-2 border-gray-300 hover:scale-110 transition-transform" style="background-color: #8b5cf6" data-color="#8b5cf6" title="Ungu"></button>
                                    <button class="preset-color w-8 h-8 rounded-lg border-2 border-gray-300 hover:scale-110 transition-transform" style="background-color: #f59e0b" data-color="#f59e0b" title="Kuning"></button>
                                    <button class="preset-color w-8 h-8 rounded-lg border-2 border-gray-300 hover:scale-110 transition-transform" style="background-color: #ef4444" data-color="#ef4444" title="Merah"></button>
                                    <button class="preset-color w-8 h-8 rounded-lg border-2 border-gray-300 hover:scale-110 transition-transform" style="background-color: #06b6d4" data-color="#06b6d4" title="Cyan (Default)"></button>
                                </div>
                            </div>
                            
                            <button id="resetColorBtn" class="w-full px-3 py-2 text-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Reset ke Default
                            </button>
                        </div>
                    </div>
                    
                    <!-- Dark Mode Toggle -->
                    <button 
                        id="darkModeToggle"
                        class="p-2 theme-bg-100 dark:theme-bg-800 theme-text-600 dark:theme-text-300 rounded-xl theme-hover-bg-200 dark:theme-hover-bg-700 transition-all duration-300"
                        title="Toggle Mode Gelap"
                    >
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Search Box with View Toggle -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-2">
            <div class="flex items-center justify-center space-x-4">
                <!-- Search Box -->
                <div class="relative max-w-md flex-1">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Cari file atau folder..."
                        class="w-full px-4 py-3 pl-12 pr-12 bg-white dark:bg-gray-700 border theme-border-200 dark:theme-border-700 rounded-xl focus:outline-none theme-search-glow text-gray-900 dark:text-white text-base shadow-sm"
                    >
                    <svg class="w-5 h-5 theme-text-500 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <button 
                        id="clearSearchBtn"
                        class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors duration-200 hidden"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                
                <!-- View Mode Toggle -->
                <div class="flex items-center bg-gray-100 dark:bg-gray-700 rounded-xl p-1">
                    <button 
                        id="listViewBtn"
                        class="p-2.5 rounded-lg transition-all duration-300 view-mode-btn active"
                        title="Tampilan List"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                    </button>
                    <button 
                        id="gridViewBtn"
                        class="p-2.5 rounded-lg transition-all duration-300 view-mode-btn"
                        title="Tampilan Grid"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Breadcrumb Navigation - Integrated in Header -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 border-t theme-border-100 dark:theme-border-700">
            <div class="flex items-center space-x-2 text-base sm:text-lg">

        // Color Theme System
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function generateColorShades(baseColor) {
            const rgb = hexToRgb(baseColor);
            if (!rgb) return null;

            // Generate different shades based on the base color
            const shades = {
                50: `${Math.min(255, rgb.r + 60)}, ${Math.min(255, rgb.g + 60)}, ${Math.min(255, rgb.b + 60)}`,
                100: `${Math.min(255, rgb.r + 40)}, ${Math.min(255, rgb.g + 40)}, ${Math.min(255, rgb.b + 40)}`,
                200: `${Math.min(255, rgb.r + 20)}, ${Math.min(255, rgb.g + 20)}, ${Math.min(255, rgb.b + 20)}`,
                300: `${Math.min(255, rgb.r + 10)}, ${Math.min(255, rgb.g + 10)}, ${Math.min(255, rgb.b + 10)}`,
                400: `${Math.min(255, rgb.r + 5)}, ${Math.min(255, rgb.g + 5)}, ${Math.min(255, rgb.b + 5)}`,
                500: `${rgb.r}, ${rgb.g}, ${rgb.b}`,
                600: `${Math.max(0, rgb.r - 20)}, ${Math.max(0, rgb.g - 20)}, ${Math.max(0, rgb.b - 20)}`,
                700: `${Math.max(0, rgb.r - 40)}, ${Math.max(0, rgb.g - 40)}, ${Math.max(0, rgb.b - 40)}`,
                800: `${Math.max(0, rgb.r - 60)}, ${Math.max(0, rgb.g - 60)}, ${Math.max(0, rgb.b - 60)}`,
                900: `${Math.max(0, rgb.r - 80)}, ${Math.max(0, rgb.g - 80)}, ${Math.max(0, rgb.b - 80)}`
            };

            return shades;
        }

        function applyThemeColor(color) {
            const shades = generateColorShades(color);
            if (!shades) return;

            const root = document.documentElement;
            root.style.setProperty('--theme-color', shades[500]);
            root.style.setProperty('--theme-50', shades[50]);
            root.style.setProperty('--theme-100', shades[100]);
            root.style.setProperty('--theme-200', shades[200]);
            root.style.setProperty('--theme-300', shades[300]);
            root.style.setProperty('--theme-400', shades[400]);
            root.style.setProperty('--theme-500', shades[500]);
            root.style.setProperty('--theme-600', shades[600]);
            root.style.setProperty('--theme-700', shades[700]);
            root.style.setProperty('--theme-800', shades[800]);
            root.style.setProperty('--theme-900', shades[900]);

            // Save to localStorage

        // Cache untuk menyimpan ukuran file yang sudah dideteksi
        const fileSizeCache = new Map();

        // Fungsi untuk mendeteksi ukuran file secara otomatis
        async function detectFileSize(filePath) {
            // Cek cache terlebih dahulu
            if (fileSizeCache.has(filePath)) {
                return fileSizeCache.get(filePath);
            }

            try {
                const response = await fetch(filePath, { method: 'HEAD' });
                if (response.ok) {
                    const contentLength = response.headers.get('Content-Length');
                    if (contentLength) {
                        const size = parseInt(contentLength);
                        fileSizeCache.set(filePath, size);
                        return size;
                    }
                }
            } catch (error) {
                console.log(`Tidak dapat mendeteksi ukuran file: ${filePath}`);
            }

            // Fallback: coba dengan fetch biasa untuk mendapatkan ukuran
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const blob = await response.blob();
                    const size = blob.size;
                    fileSizeCache.set(filePath, size);
                    return size;
                }
            } catch (error) {
                console.log(`Fallback gagal untuk: ${filePath}`);
            }

            return null;
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === null || bytes === undefined) return 'Mendeteksi...';
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateFileSizeInDisplay(filePath, size, fileElement) {
            const sizeElements = fileElement.querySelectorAll('.file-size');
            sizeElements.forEach(element => {

                    element.textContent = formatFileSize(size);
                }
            });

        // Current directory state
        let currentDirectory = '.';
        
        // View mode state

        // Function to open file

                const mappedFolder = folderMap[folder] || folder;
                filePath = `${mappedFolder}/${filename}`;

            // Open file in new tab
            window.open(filePath, '_blank');

        class SnowAnimation {
            constructor() {

                this.toggle = document.getElementById('snowToggle');
                this.isActive = false;
                this.snowflakes = [];
                this.maxSnowflakes = 30;
                this.animationInterval = null;
                this.snowflakeSymbols = ['❄', '❅', '❆', '✻', '✼', '❋'];

            init() {

                // Update existing snowflakes when theme changes
                this.snowflakes.forEach(snowflake => {

                            snowflake.style.background = 'radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3))';

                            snowflake.style.boxShadow = '0 0 10px rgba(59, 130, 246, 0.3)';

            createSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                
                // Check if dark mode is active
                const isDarkMode = document.documentElement.classList.contains('dark');
                
                if (isDarkMode) {
                    // Snow mode for dark theme
                    snowflake.innerHTML = this.snowflakeSymbols[Math.floor(Math.random() * this.snowflakeSymbols.length)];
                    snowflake.style.color = 'rgba(255, 255, 255, 0.8)';
                    snowflake.style.background = 'none';
                    snowflake.style.border = 'none';
                    snowflake.style.boxShadow = 'none';
                    snowflake.style.width = 'auto';
                    snowflake.style.height = 'auto';
                    snowflake.style.borderRadius = '0';
                    snowflake.style.display = 'block';
                } else {
                    // Bubble mode for light theme
                    snowflake.innerHTML = this.bubbleSymbols[Math.floor(Math.random() * this.bubbleSymbols.length)];
                    snowflake.style.color = 'rgba(59, 130, 246, 0.6)';
                    snowflake.style.background = 'radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3))';
                    snowflake.style.border = '1px solid rgba(59, 130, 246, 0.2)';
                    snowflake.style.boxShadow = '0 0 10px rgba(59, 130, 246, 0.3)';
                    snowflake.style.borderRadius = '50%';
                    snowflake.style.width = '1em';
                    snowflake.style.height = '1em';
                    snowflake.style.display = 'flex';
                    snowflake.style.alignItems = 'center';
                    snowflake.style.justifyContent = 'center';
                }
                
                // Random horizontal position
                snowflake.style.left = Math.random() * 100 + '%';
                
                // Random size variations
                const sizes = ['0.6em', '0.8em', '1em', '1.2em', '1.4em'];
                snowflake.style.fontSize = sizes[Math.floor(Math.random() * sizes.length)];
                
                // Random animation duration
                const durations = ['8s', '10s', '12s', '15s', '18s'];
                snowflake.style.animationDuration = durations[Math.floor(Math.random() * durations.length)];
                
                // Random animation delay
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                
                // Random opacity
                snowflake.style.opacity = Math.random() * 0.6 + 0.4;
                
                return snowflake;
            }
            
            start() {
                if (!this.container) return;
                
                this.isActive = true;
                this.container.classList.remove('hidden');
                if (this.toggle) {
                    this.toggle.classList.add('active');
                }
                
                // Clear any existing interval
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                }
                
                // Create snowflakes continuously
                this.animationInterval = setInterval(() => {
                    if (this.isActive && this.snowflakes.length < this.maxSnowflakes) {
                        const snowflake = this.createSnowflake();
                        this.container.appendChild(snowflake);
                        this.snowflakes.push(snowflake);
                        
                        // Remove snowflake after animation completes
                        setTimeout(() => {
                            if (snowflake && snowflake.parentNode) {
                                snowflake.parentNode.removeChild(snowflake);
                                const index = this.snowflakes.indexOf(snowflake);
                                if (index > -1) {
                                    this.snowflakes.splice(index, 1);
                                }

                    }
                }, 300); // Create new snowflake every 300ms
                
                // Save state
                localStorage.setItem('snowAnimation', 'true');
            }
            
            stop() {
                this.isActive = false;
                
                if (this.container) {
                    this.container.classList.add('hidden');
                }
                
                if (this.toggle) {
                    this.toggle.classList.remove('active');
                }
                
                // Clear interval
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                
                // Clear all snowflakes
                this.snowflakes.forEach(snowflake => {
                    if (snowflake && snowflake.parentNode) {
                        snowflake.parentNode.removeChild(snowflake);
                    }
                });
                this.snowflakes = [];
                
                // Clear container
                if (this.container) {
                    this.container.innerHTML = '';
                }
                
                // Save state
                localStorage.setItem('snowAnimation', 'false');
            }
        }
        
        // Initialize snow animation
