        /* Snow/Bubble Animation */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            font-size: 1em;
            animation: snowfall linear infinite;
            user-select: none;
        }
        
        /* Snow mode (dark theme) */
        .dark .snowflake {
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* Bubble mode (light theme) */
        .snowflake {
            color: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(59, 130, 246, 0.2);
            width: 1em;
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        
        .dark .snowflake {
            background: none;
            border: none;
            box-shadow: none;
            width: auto;
            height: auto;
            display: block;
        }
        
        @keyframes snowfall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Different snowflake/bubble sizes and speeds */
        .snowflake:nth-child(odd) {
            animation-duration: 10s;
            font-size: 0.8em;
        }
        
        .snowflake:nth-child(even) {
            animation-duration: 15s;
            font-size: 1.2em;
        }
        
        .snowflake:nth-child(3n) {
            animation-duration: 12s;
            font-size: 0.6em;
        }
        
        .snowflake:nth-child(4n) {
            animation-duration: 18s;
            font-size: 1.4em;
        }
        
        .snowflake:nth-child(5n) {
            animation-duration: 8s;
            font-size: 0.9em;
        }
        
        /* Particle Animation */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFade 2s ease-out forwards;
        }
        
        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 0.8;
                transform: scale(1) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.5) rotate(360deg);
            }
        }
        
        /* Mouse trail effect */
        .mouse-trail {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: trailFade 1s ease-out forwards;
            z-index: 998;
        }
        
        @keyframes trailFade {
            0% {
                opacity: 0.8;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
            }
        }

        /* Shimmer Effect for Title */
        .shimmer-text {

        /* Shimmer Effect for Subtitle */

        @keyframes shimmer {
            0% {
                background-position: 800% 0;
            }
            100% {
                background-position: -800% 0;
            }
        }
        
        /* Shimmer Icon Effect (but NOT for folder icons) */
        .shimmer-icon:not(.folder-icon) {

        }

            content: '';

        @keyframes shimmer-icon {

        /* Floating Animation for All Icons and Text */
        .file-icon, .folder-icon, .floating-text {
            animation: iconFloat 3s ease-in-out infinite;
        }
        
        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        
        /* Enhanced Hover Effects - Combining with Float Animation */
        .file-item:hover .file-icon {
            animation: iconFloat 3s ease-in-out infinite, iconHover 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .grid-item:hover .file-icon {
            animation: iconFloat 3s ease-in-out infinite, iconHover 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .file-item:hover .folder-icon, .grid-item:hover .folder-icon {
            animation: iconFloat 3s ease-in-out infinite, folderHover 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes iconHover {
            0% {
                transform: translateY(var(--float-y, 0px)) scale(1) rotate(0deg);
            }
            100% {
                transform: translateY(var(--float-y, 0px)) scale(1.15) rotate(3deg);
            }
        }
        
        @keyframes folderHover {

            animation-delay: 0.5s;
            animation-duration: 3.5s;

        .file-icon:nth-child(even), .folder-icon:nth-child(even) {
            animation-delay: 1s;
            animation-duration: 2.8s;
        }

        }
        
        .file-icon:nth-child(4n), .folder-icon:nth-child(4n) {
            animation-delay: 0.2s;

            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function generateColorShades(baseColor) {
            const rgb = hexToRgb(baseColor);
            if (!rgb) return null;

            // Generate different shades based on the base color
            const shades = {
                50: `${Math.min(255, rgb.r + 60)}, ${Math.min(255, rgb.g + 60)}, ${Math.min(255, rgb.b + 60)}`,
                100: `${Math.min(255, rgb.r + 40)}, ${Math.min(255, rgb.g + 40)}, ${Math.min(255, rgb.b + 40)}`,
                200: `${Math.min(255, rgb.r + 20)}, ${Math.min(255, rgb.g + 20)}, ${Math.min(255, rgb.b + 20)}`,
                300: `${Math.min(255, rgb.r + 10)}, ${Math.min(255, rgb.g + 10)}, ${Math.min(255, rgb.b + 10)}`,
                400: `${Math.min(255, rgb.r + 5)}, ${Math.min(255, rgb.g + 5)}, ${Math.min(255, rgb.b + 5)}`,
                500: `${rgb.r}, ${rgb.g}, ${rgb.b}`,
                600: `${Math.max(0, rgb.r - 20)}, ${Math.max(0, rgb.g - 20)}, ${Math.max(0, rgb.b - 20)}`,
                700: `${Math.max(0, rgb.r - 40)}, ${Math.max(0, rgb.g - 40)}, ${Math.max(0, rgb.b - 40)}`,
                800: `${Math.max(0, rgb.r - 60)}, ${Math.max(0, rgb.g - 60)}, ${Math.max(0, rgb.b - 60)}`,
                900: `${Math.max(0, rgb.r - 80)}, ${Math.max(0, rgb.g - 80)}, ${Math.max(0, rgb.b - 80)}`
            };

            return shades;
        }

            const shades = generateColorShades(color);

        // Cache untuk menyimpan ukuran file yang sudah dideteksi
        const fileSizeCache = new Map();

        // Fungsi untuk mendeteksi ukuran file secara otomatis
        async function detectFileSize(filePath) {
            // Cek cache terlebih dahulu
            if (fileSizeCache.has(filePath)) {
                return fileSizeCache.get(filePath);
            }

            try {
                const response = await fetch(filePath, { method: 'HEAD' });
                if (response.ok) {
                    const contentLength = response.headers.get('Content-Length');
                    if (contentLength) {
                        const size = parseInt(contentLength);
                        fileSizeCache.set(filePath, size);
                        return size;
                    }
                }
            } catch (error) {
                console.log(`Tidak dapat mendeteksi ukuran file: ${filePath}`);
            }

            // Fallback: coba dengan fetch biasa untuk mendapatkan ukuran
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const blob = await response.blob();
                    const size = blob.size;
                    fileSizeCache.set(filePath, size);
                    return size;
                }
            } catch (error) {
                console.log(`Fallback gagal untuk: ${filePath}`);
            }

            return null;
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === null || bytes === undefined) return 'Mendeteksi...';
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Fungsi untuk memperbarui ukuran file di tampilan
        function updateFileSizeInDisplay(filePath, size, fileElement) {
            const sizeElements = fileElement.querySelectorAll('.file-size');
            sizeElements.forEach(element => {
                if (typeof size === 'string') {
                    element.textContent = size;
                } else {
                    element.textContent = formatFileSize(size);
                }
            });
        }
