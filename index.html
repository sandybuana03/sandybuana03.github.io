<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buana Explorer - Smart Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'islamic-green': {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .glow-effect {
            box-shadow: 0 0 30px rgba(var(--theme-color), 0.4), 0 0 60px rgba(var(--theme-color), 0.2);
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 30px rgba(var(--theme-color), 0.4), 0 0 60px rgba(var(--theme-color), 0.2); }
            100% { box-shadow: 0 0 40px rgba(var(--theme-color), 0.6), 0 0 80px rgba(var(--theme-color), 0.3); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .file-item {
            position: relative;
            overflow: hidden;
        }
        
        .file-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(var(--theme-color), 0.08), transparent);
            transition: left 0.5s ease;
            z-index: 1;
        }
        
        .file-item:hover::after {
            left: 100%;
        }
        
        .file-item:hover {
            transform: translateY(-6px) scale(1.01);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(var(--theme-color), 0.12), 0 10px 25px rgba(0, 0, 0, 0.08);
            border-color: rgb(var(--theme-300));
        }
        
        .dark .file-item:hover {
            box-shadow: 0 15px 35px rgba(var(--theme-color), 0.15), 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgb(var(--theme-500));
        }
        
        .file-item .file-icon {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            position: relative;
        }
        
        .file-item:hover .file-icon {
            transform: scale(1.15) rotate(3deg);
        }
        
        .search-glow:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1), 0 0 20px rgba(34, 197, 94, 0.2);
        }
        
        /* Dynamic Color Variables */
        :root {
            --theme-color: 6, 182, 212;
            --theme-50: 236, 254, 255;
            --theme-100: 207, 250, 254;
            --theme-200: 165, 243, 252;
            --theme-300: 103, 232, 249;
            --theme-400: 34, 211, 238;
            --theme-500: 6, 182, 212;
            --theme-600: 8, 145, 178;
            --theme-700: 14, 116, 144;
            --theme-800: 21, 94, 117;
            --theme-900: 22, 78, 99;
        }
        
        /* Dynamic Theme Classes */
        .theme-bg-50 { background-color: rgb(var(--theme-50)); }
        .theme-bg-100 { background-color: rgb(var(--theme-100)); }
        .theme-bg-200 { background-color: rgb(var(--theme-200)); }
        .theme-bg-500 { background-color: rgb(var(--theme-500)); }
        .theme-bg-600 { background-color: rgb(var(--theme-600)); }
        .theme-bg-700 { background-color: rgb(var(--theme-700)); }
        .theme-bg-800 { background-color: rgb(var(--theme-800)); }
        .theme-bg-900 { background-color: rgb(var(--theme-900)); }
        
        .theme-text-50 { color: rgb(var(--theme-50)); }
        .theme-text-100 { color: rgb(var(--theme-100)); }
        .theme-text-200 { color: rgb(var(--theme-200)); }
        .theme-text-300 { color: rgb(var(--theme-300)); }
        .theme-text-400 { color: rgb(var(--theme-400)); }
        .theme-text-500 { color: rgb(var(--theme-500)); }
        .theme-text-600 { color: rgb(var(--theme-600)); }
        .theme-text-700 { color: rgb(var(--theme-700)); }
        .theme-text-800 { color: rgb(var(--theme-800)); }
        
        .theme-border-100 { border-color: rgb(var(--theme-100)); }
        .theme-border-200 { border-color: rgb(var(--theme-200)); }
        .theme-border-700 { border-color: rgb(var(--theme-700)); }
        .theme-border-800 { border-color: rgb(var(--theme-800)); }
        
        .theme-glow {
            box-shadow: 0 0 20px rgba(var(--theme-color), 0.3);
        }
        
        .theme-search-glow:focus {
            box-shadow: 0 0 0 4px rgba(var(--theme-color), 0.15), 0 0 30px rgba(var(--theme-color), 0.3), 0 10px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px) scale(1.02);
        }
        
        .theme-hover-bg-200:hover { 
            background-color: rgb(var(--theme-200)); 
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(var(--theme-color), 0.15);
        }
        .theme-hover-bg-700:hover { 
            background-color: rgb(var(--theme-700)); 
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(var(--theme-color), 0.2);
        }
        .theme-hover-bg-900-10:hover { 
            background-color: rgba(var(--theme-900), 0.1); 
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(var(--theme-color), 0.1);
        }
        
        /* View Mode Styles */
        .view-mode-btn {
            color: #6b7280;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        .view-mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .view-mode-btn:hover::before {
            left: 100%;
        }
        
        .view-mode-btn.active {
            background-color: rgb(var(--theme-500));
            color: white;
            box-shadow: 0 4px 15px rgba(var(--theme-color), 0.3);
            transform: scale(1.05);
        }
        
        .view-mode-btn:not(.active):hover {
            background-color: rgba(var(--theme-500), 0.1);
            color: rgb(var(--theme-600));
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(var(--theme-color), 0.15);
        }
        
        /* Grid View Styles */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        .grid-item {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgb(var(--theme-100));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        .dark .grid-item {
            background: #374151;
            border-color: rgb(var(--theme-800));
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .grid-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(var(--theme-color), 0.1), transparent);
            transition: left 0.6s ease;
        }
        
        .grid-item:hover::before {
            left: 100%;
        }
        
        .grid-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(var(--theme-color), 0.15), 0 15px 30px rgba(0, 0, 0, 0.1);
            border-color: rgb(var(--theme-400));
        }
        
        .dark .grid-item:hover {
            box-shadow: 0 20px 40px rgba(var(--theme-color), 0.2), 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: rgb(var(--theme-500));
        }
        
        .grid-item .file-icon {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }
        
        .grid-item:hover .file-icon {
            transform: scale(1.15) rotate(5deg);
        }
        
        .grid-item .folder-icon {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .grid-item:hover .folder-icon {
            transform: scale(1.1) rotate(3deg);
        }
        
        /* Snow/Bubble Animation */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            font-size: 1em;
            animation: snowfall linear infinite;
            user-select: none;
        }
        
        /* Snow mode (dark theme) */
        .dark .snowflake {
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* Bubble mode (light theme) */
        .snowflake {
            color: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(59, 130, 246, 0.2);
            width: 1em;
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        
        .dark .snowflake {
            background: none;
            border: none;
            box-shadow: none;
            width: auto;
            height: auto;
            display: block;
        }
        
        @keyframes snowfall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Different snowflake/bubble sizes and speeds */
        .snowflake:nth-child(odd) {
            animation-duration: 10s;
            font-size: 0.8em;
        }
        
        .snowflake:nth-child(even) {
            animation-duration: 15s;
            font-size: 1.2em;
        }
        
        .snowflake:nth-child(3n) {
            animation-duration: 12s;
            font-size: 0.6em;
        }
        
        .snowflake:nth-child(4n) {
            animation-duration: 18s;
            font-size: 1.4em;
        }
        
        .snowflake:nth-child(5n) {
            animation-duration: 8s;
            font-size: 0.9em;
        }
        
        /* Particle Animation */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFade 2s ease-out forwards;
        }
        
        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 0.8;
                transform: scale(1) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.5) rotate(360deg);
            }
        }
        
        /* Mouse trail effect */
        .mouse-trail {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: trailFade 1s ease-out forwards;
            z-index: 998;
        }
        
        @keyframes trailFade {
            0% {
                opacity: 0.8;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
            }
        }

        /* Shimmer Effect for Title */
        .shimmer-text {
            background: linear-gradient(
                90deg,
                rgba(var(--theme-color), 0.6) 0%,
                rgba(var(--theme-color), 0.6) 35%,
                rgba(255, 255, 255, 1) 45%,
                rgba(255, 255, 255, 1) 55%,
                rgba(var(--theme-color), 0.6) 65%,
                rgba(var(--theme-color), 0.6) 100%
            );
            background-size: 800% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 80s ease-in-out infinite;
            position: relative;
        }
        
        .dark .shimmer-text {
            background: linear-gradient(
                90deg,
                rgba(var(--theme-color), 0.7) 0%,
                rgba(var(--theme-color), 0.7) 35%,
                rgba(255, 255, 255, 1) 45%,
                rgba(255, 255, 255, 1) 55%,
                rgba(var(--theme-color), 0.7) 65%,
                rgba(var(--theme-color), 0.7) 100%
            );
            background-size: 800% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Shimmer Effect for Subtitle */
        .shimmer-subtitle {
            background: linear-gradient(
                90deg,
                rgba(var(--theme-color), 0.7) 0%,
                rgba(var(--theme-color), 0.7) 40%,
                rgba(var(--theme-color), 1) 50%,
                rgba(var(--theme-color), 0.7) 60%,
                rgba(var(--theme-color), 0.7) 100%
            );
            background-size: 600% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 100s ease-in-out infinite 8s;
        }
        
        .dark .shimmer-subtitle {
            background: linear-gradient(
                90deg,
                rgba(var(--theme-color), 0.8) 0%,
                rgba(var(--theme-color), 0.8) 40%,
                rgba(var(--theme-color), 1) 50%,
                rgba(var(--theme-color), 0.8) 60%,
                rgba(var(--theme-color), 0.8) 100%
            );
            background-size: 600% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes shimmer {
            0% {
                background-position: 800% 0;
            }
            100% {
                background-position: -800% 0;
            }
        }
        
        /* Shimmer Icon Effect (but NOT for folder icons) */
        .shimmer-icon:not(.folder-icon) {
            position: relative;
            overflow: hidden;
        }
        
        .shimmer-icon:not(.folder-icon)::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 70%
            );
            animation: shimmer-icon 2s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes shimmer-icon {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        /* Floating Animation for All Icons and Text */
        .file-icon, .folder-icon, .floating-text {
            animation: iconFloat 3s ease-in-out infinite;
        }
        
        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        
        /* Enhanced Hover Effects - Combining with Float Animation */
        .file-item:hover .file-icon {
            animation: iconFloat 3s ease-in-out infinite, iconHover 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .grid-item:hover .file-icon {
            animation: iconFloat 3s ease-in-out infinite, iconHover 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .file-item:hover .folder-icon, .grid-item:hover .folder-icon {
            animation: iconFloat 3s ease-in-out infinite, folderHover 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes iconHover {
            0% {
                transform: translateY(var(--float-y, 0px)) scale(1) rotate(0deg);
            }
            100% {
                transform: translateY(var(--float-y, 0px)) scale(1.15) rotate(3deg);
            }
        }
        
        @keyframes folderHover {
            0% {
                transform: translateY(var(--float-y, 0px)) scale(1) rotate(0deg);
            }
            100% {
                transform: translateY(var(--float-y, 0px)) scale(1.1) rotate(3deg);
            }
        }
        
        /* Different timing for variety - Icons */
        .file-icon:nth-child(odd), .folder-icon:nth-child(odd) {
            animation-delay: 0.5s;
            animation-duration: 3.5s;
        }
        
        .file-icon:nth-child(even), .folder-icon:nth-child(even) {
            animation-delay: 1s;
            animation-duration: 2.8s;
        }
        
        .file-icon:nth-child(3n), .folder-icon:nth-child(3n) {
            animation-delay: 1.5s;
            animation-duration: 3.2s;
        }
        
        .file-icon:nth-child(4n), .folder-icon:nth-child(4n) {
            animation-delay: 0.2s;
            animation-duration: 3.8s;
        }
        
        .file-icon:nth-child(5n), .folder-icon:nth-child(5n) {
            animation-delay: 1.8s;
            animation-duration: 2.5s;
        }
        
        /* Text Floating Animation with Different Patterns */
        .floating-text:nth-child(1n) {
            animation-delay: 0.3s;
            animation-duration: 4.2s;
        }
        
        .floating-text:nth-child(2n) {
            animation-delay: 0.8s;
            animation-duration: 3.7s;
        }
        
        .floating-text:nth-child(3n) {
            animation-delay: 1.2s;
            animation-duration: 4.5s;
        }
        
        .floating-text:nth-child(4n) {
            animation-delay: 0.1s;
            animation-duration: 3.3s;
        }
        
        .floating-text:nth-child(5n) {
            animation-delay: 1.6s;
            animation-duration: 4.8s;
        }
        
        /* Gentle Text Float for File Names */
        .file-name-float {
            animation: gentleTextFloat 4.5s ease-in-out infinite;
        }
        
        @keyframes gentleTextFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }
        
        /* Subtle Float for Secondary Text */
        .secondary-text-float {
            animation: subtleFloat 5.2s ease-in-out infinite;
        }
        
        @keyframes subtleFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-2px);
            }
        }
        
        /* Different delays for text elements */
        .file-name-float:nth-child(odd) {
            animation-delay: 0.7s;
        }
        
        .file-name-float:nth-child(even) {
            animation-delay: 1.4s;
        }
        
        .secondary-text-float:nth-child(odd) {
            animation-delay: 2.1s;
        }
        
        .secondary-text-float:nth-child(even) {
            animation-delay: 2.8s;
        }

        /* Control buttons container */
        .control-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* Snow control button */
        .snow-toggle {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: #6b7280;
        }
        
        .dark .snow-toggle {
            background: rgba(55, 65, 81, 0.9);
            border-color: rgba(255, 255, 255, 0.1);
            color: #9ca3af;
        }
        
        .snow-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.2);
            background: rgba(var(--theme-500), 0.1);
            border-color: rgba(var(--theme-color), 0.3);
            color: rgb(var(--theme-600));
        }
        
        .dark .snow-toggle:hover {
            background: rgba(var(--theme-500), 0.15);
            border-color: rgba(var(--theme-color), 0.4);
            color: rgb(var(--theme-400));
        }
        
        .snow-toggle.active {
            background: rgba(var(--theme-500), 0.9);
            color: white;
            border-color: rgba(var(--theme-color), 0.6);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.3);
        }
        
        .dark .snow-toggle.active {
            background: rgba(var(--theme-600), 0.9);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.4);
        }
        
        /* Particle control button */
        .particle-toggle {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: #6b7280;
        }
        
        .dark .particle-toggle {
            background: rgba(55, 65, 81, 0.9);
            border-color: rgba(255, 255, 255, 0.1);
            color: #9ca3af;
        }
        
        .particle-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.2);
            background: rgba(var(--theme-500), 0.1);
            border-color: rgba(var(--theme-color), 0.3);
            color: rgb(var(--theme-600));
        }
        
        .dark .particle-toggle:hover {
            background: rgba(var(--theme-500), 0.15);
            border-color: rgba(var(--theme-color), 0.4);
            color: rgb(var(--theme-400));
        }
        
        .particle-toggle.active {
            background: rgba(var(--theme-500), 0.9);
            color: white;
            border-color: rgba(var(--theme-color), 0.6);
            box-shadow: 0 12px 40px rgba(var(--theme-color), 0.3);
        }
        
        .dark .particle-toggle.active {
            background: rgba(var(--theme-600), 0.9);

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function generateColorShades(baseColor) {
            const rgb = hexToRgb(baseColor);
            if (!rgb) return null;

            // Generate different shades based on the base color
            const shades = {
                50: `${Math.min(255, rgb.r + 60)}, ${Math.min(255, rgb.g + 60)}, ${Math.min(255, rgb.b + 60)}`,
                100: `${Math.min(255, rgb.r + 40)}, ${Math.min(255, rgb.g + 40)}, ${Math.min(255, rgb.b + 40)}`,
                200: `${Math.min(255, rgb.r + 20)}, ${Math.min(255, rgb.g + 20)}, ${Math.min(255, rgb.b + 20)}`,
                300: `${Math.min(255, rgb.r + 10)}, ${Math.min(255, rgb.g + 10)}, ${Math.min(255, rgb.b + 10)}`,
                400: `${Math.min(255, rgb.r + 5)}, ${Math.min(255, rgb.g + 5)}, ${Math.min(255, rgb.b + 5)}`,
                500: `${rgb.r}, ${rgb.g}, ${rgb.b}`,
                600: `${Math.max(0, rgb.r - 20)}, ${Math.max(0, rgb.g - 20)}, ${Math.max(0, rgb.b - 20)}`,
                700: `${Math.max(0, rgb.r - 40)}, ${Math.max(0, rgb.g - 40)}, ${Math.max(0, rgb.b - 40)}`,
                800: `${Math.max(0, rgb.r - 60)}, ${Math.max(0, rgb.g - 60)}, ${Math.max(0, rgb.b - 60)}`,
                900: `${Math.max(0, rgb.r - 80)}, ${Math.max(0, rgb.g - 80)}, ${Math.max(0, rgb.b - 80)}`
            };

            return shades;
        }

        function applyThemeColor(color) {
            const shades = generateColorShades(color);
            if (!shades) return;

            const root = document.documentElement;
            root.style.setProperty('--theme-color', shades[500]);
            root.style.setProperty('--theme-50', shades[50]);
            root.style.setProperty('--theme-100', shades[100]);
            root.style.setProperty('--theme-200', shades[200]);
            root.style.setProperty('--theme-300', shades[300]);
            root.style.setProperty('--theme-400', shades[400]);
            root.style.setProperty('--theme-500', shades[500]);

            root.style.setProperty('--theme-700', shades[700]);
            root.style.setProperty('--theme-800', shades[800]);

        // Cache untuk menyimpan ukuran file yang sudah dideteksi
        const fileSizeCache = new Map();

        // Fungsi untuk mendeteksi ukuran file secara otomatis
        async function detectFileSize(filePath) {
            // Cek cache terlebih dahulu
            if (fileSizeCache.has(filePath)) {
                return fileSizeCache.get(filePath);
            }

            try {
                const response = await fetch(filePath, { method: 'HEAD' });
                if (response.ok) {
                    const contentLength = response.headers.get('Content-Length');
                    if (contentLength) {
                        const size = parseInt(contentLength);
                        fileSizeCache.set(filePath, size);
                        return size;
                    }
                }
            } catch (error) {
                console.log(`Tidak dapat mendeteksi ukuran file: ${filePath}`);
            }

            // Fallback: coba dengan fetch biasa untuk mendapatkan ukuran
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const blob = await response.blob();
                    const size = blob.size;
                    fileSizeCache.set(filePath, size);
                    return size;
                }
            } catch (error) {
                console.log(`Fallback gagal untuk: ${filePath}`);
            }

            return null;
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === null || bytes === undefined) return 'Mendeteksi...';
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateFileSizeInDisplay(filePath, size, fileElement) {
            const sizeElements = fileElement.querySelectorAll('.file-size');
            sizeElements.forEach(element => {
                if (typeof size === 'string') {
                    element.textContent = size;
                } else {
                    element.textContent = formatFileSize(size);
                }
            });
        }

        // Snow/Bubble Animation System
        class SnowAnimation {
            constructor() {
                this.container = null;
                this.toggle = null;
                this.isActive = false;
                this.snowflakes = [];
                this.maxSnowflakes = 30;
                this.animationInterval = null;
                this.snowflakeSymbols = ['❄', '❅', '❆', '✻', '✼', '❋'];
                this.bubbleSymbols = ['○', '◯', '◦', '●', '◉', '⚬'];
                this.initialized = false;
                this.initRetryCount = 0;
                this.maxRetries = 20;
                
                console.log('SnowAnimation constructor called');
                this.init();
            }
            
            init() {
                console.log('SnowAnimation init called, retry count:', this.initRetryCount);
                
                // Force stop any existing animation first
                this.forceStop();
                
                // Get elements immediately
                this.container = document.getElementById('snowContainer');
                this.toggle = document.getElementById('snowToggle');
                
                console.log('Snow elements found:', {
                    container: !!this.container,
                    toggle: !!this.toggle,
                    initialized: this.initialized
                });
                
                if (this.container && this.toggle) {
                    if (!this.initialized) {
                        this.initialized = true;
                        console.log('Setting up snow events...');
                        this.setupEvents();
                        
                        // Load saved state immediately
                        setTimeout(() => {
                            this.loadSavedState();
                        }, 100);
                    }
                } else {
                    // Retry with exponential backoff
                    this.initRetryCount++;
                    if (this.initRetryCount < this.maxRetries) {
                        const delay = Math.min(100 * this.initRetryCount, 1000);
                        console.log(`Snow init retry ${this.initRetryCount} in ${delay}ms`);
                        setTimeout(() => this.init(), delay);
                    } else {
                        console.error('Snow animation failed to initialize after max retries');
                    }
                }
            }
            
            forceStop() {
                // Force cleanup without saving state
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                
                // Clear all snowflakes
                this.snowflakes.forEach(snowflake => {
                    if (snowflake && snowflake.parentNode) {
                        try {
                            snowflake.parentNode.removeChild(snowflake);
                        } catch (e) {
                            // Ignore errors
                        }
                    }
                });
                this.snowflakes = [];
                
                // Clear container if it exists
                const container = document.getElementById('snowContainer');
                if (container) {
                    container.innerHTML = '';
                    container.classList.add('hidden');
                }
                
                // Reset toggle button
                const toggle = document.getElementById('snowToggle');
                if (toggle) {
                    toggle.classList.remove('active');
                }
                
                this.isActive = false;
            }
            
            setupEvents() {
                console.log('Setting up snow events...');
                
                // Remove any existing event listeners first
                if (this.toggle) {
                    // Clone node to remove all event listeners
                    const newToggle = this.toggle.cloneNode(true);
                    this.toggle.parentNode.replaceChild(newToggle, this.toggle);
                    this.toggle = newToggle;
                    
                    // Add new event listener
                    this.toggle.addEventListener('click', () => {
                        console.log('Snow toggle clicked, current state:', this.isActive);
                        this.isActive ? this.stop() : this.start();
                    });
                }
                
                // Listen for theme changes to update animation style
                const observer = new MutationObserver(() => {
                    if (this.isActive) {
                        this.updateSnowflakeStyles();
                    }
                });
                
                observer.observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }
            
            loadSavedState() {
                console.log('Loading snow saved state...');
                
                // Don't call stop() here as it might interfere with initialization
                const savedState = localStorage.getItem('snowAnimation');
                console.log('Snow saved state:', savedState);
                
                // Default to active if no saved state exists, or if saved state is true
                if (savedState === null || savedState === 'true') {
                    console.log('Starting snow animation...');
                    setTimeout(() => {
                        this.start();
                    }, 50);
                } else {
                    console.log('Snow animation disabled by saved state');
                }
            }
            
            updateSnowflakeStyles() {
                // Update existing snowflakes when theme changes
                this.snowflakes.forEach(snowflake => {
                    if (snowflake && snowflake.parentNode) {
                        const isDarkMode = document.documentElement.classList.contains('dark');
                        if (isDarkMode) {
                            snowflake.innerHTML = this.snowflakeSymbols[Math.floor(Math.random() * this.snowflakeSymbols.length)];
                            snowflake.style.background = 'none';
                            snowflake.style.border = 'none';
                            snowflake.style.boxShadow = 'none';
                            snowflake.style.borderRadius = '0';
                        } else {
                            snowflake.innerHTML = this.bubbleSymbols[Math.floor(Math.random() * this.bubbleSymbols.length)];
                            snowflake.style.background = 'radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3))';
                            snowflake.style.border = '1px solid rgba(59, 130, 246, 0.2)';
                            snowflake.style.boxShadow = '0 0 10px rgba(59, 130, 246, 0.3)';
                            snowflake.style.borderRadius = '50%';
                        }
                    }
                });
            }
            
            createSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                
                // Check if dark mode is active
                const isDarkMode = document.documentElement.classList.contains('dark');
                
                if (isDarkMode) {
                    // Snow mode for dark theme
                    snowflake.innerHTML = this.snowflakeSymbols[Math.floor(Math.random() * this.snowflakeSymbols.length)];
                    snowflake.style.color = 'rgba(255, 255, 255, 0.8)';
                    snowflake.style.background = 'none';
                    snowflake.style.border = 'none';
                    snowflake.style.boxShadow = 'none';
                    snowflake.style.width = 'auto';
                    snowflake.style.height = 'auto';
                    snowflake.style.borderRadius = '0';
                    snowflake.style.display = 'block';
                } else {
                    // Bubble mode for light theme
                    snowflake.innerHTML = this.bubbleSymbols[Math.floor(Math.random() * this.bubbleSymbols.length)];
                    snowflake.style.color = 'rgba(59, 130, 246, 0.6)';
                    snowflake.style.background = 'radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(59, 130, 246, 0.3))';
                    snowflake.style.border = '1px solid rgba(59, 130, 246, 0.2)';
                    snowflake.style.boxShadow = '0 0 10px rgba(59, 130, 246, 0.3)';
                    snowflake.style.borderRadius = '50%';
                    snowflake.style.width = '1em';
                    snowflake.style.height = '1em';
                    snowflake.style.display = 'flex';
                    snowflake.style.alignItems = 'center';
                    snowflake.style.justifyContent = 'center';
                }
                
                // Random horizontal position
                snowflake.style.left = Math.random() * 100 + '%';
                
                // Random size variations
                const sizes = ['0.6em', '0.8em', '1em', '1.2em', '1.4em'];
                snowflake.style.fontSize = sizes[Math.floor(Math.random() * sizes.length)];
                
                // Random animation duration
                const durations = ['8s', '10s', '12s', '15s', '18s'];
                snowflake.style.animationDuration = durations[Math.floor(Math.random() * durations.length)];
                
                // Random animation delay
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                
                // Random opacity
                snowflake.style.opacity = Math.random() * 0.6 + 0.4;
                
                return snowflake;
            }
            
            start() {
                console.log('Starting snow animation...');
                
                // Ensure we have the container
                if (!this.container) {
                    this.container = document.getElementById('snowContainer');
                }
                
                if (!this.container) {
                    console.error('Snow container not found!');
                    return;
                }
                
                // Ensure we have the toggle
                if (!this.toggle) {
                    this.toggle = document.getElementById('snowToggle');
                }
                
                this.isActive = true;
                this.container.classList.remove('hidden');
                
                if (this.toggle) {
                    this.toggle.classList.add('active');
                }
                
                // Clear any existing interval
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                }
                
                console.log('Snow animation started, creating snowflakes...');
                
                // Create snowflakes continuously
                this.animationInterval = setInterval(() => {
                    if (this.isActive && this.snowflakes.length < this.maxSnowflakes) {
                        try {
                            const snowflake = this.createSnowflake();
                            if (snowflake && this.container) {
                                this.container.appendChild(snowflake);
                                this.snowflakes.push(snowflake);
                                
                                // Remove snowflake after animation completes
                                setTimeout(() => {
                                    if (snowflake && snowflake.parentNode) {
                                        try {
                                            snowflake.parentNode.removeChild(snowflake);
                                            const index = this.snowflakes.indexOf(snowflake);
                                            if (index > -1) {
                                                this.snowflakes.splice(index, 1);
                                            }
                                        } catch (e) {
                                            console.log('Error removing snowflake:', e);

        // Particle Animation System
        class ParticleAnimation {
            constructor() {

                    'rgba(34, 197, 94, 0.8)',    // Green
                    'rgba(251, 191, 36, 0.8)',   // Yellow
                    'rgba(239, 68, 68, 0.8)',    // Red
                    'rgba(6, 182, 212, 0.8)',    // Cyan
                    'rgba(168, 85, 247, 0.8)'    // Violet

            init() {

                // Force cleanup first
                this.forceStop();

                this.toggle = document.getElementById('particleToggle');

                        const delay = Math.min(100 * this.initRetryCount, 1000);
                        console.log(`Particle init retry ${this.initRetryCount} in ${delay}ms`);
                        setTimeout(() => this.init(), delay);
                    } else {
                        console.error('Particle animation failed to initialize after max retries');
                    }
                }
            }
            
            forceStop() {
                // Remove event listeners
                if (this.mouseEventHandler) {
                    document.removeEventListener('mousemove', this.mouseEventHandler);

                    this.clickEventHandler = null;

                // Clear all particles
                this.particles.forEach(particle => {
                    if (particle && particle.parentNode) {

                            particle.parentNode.removeChild(particle);
                        } catch (e) {

                // Clear container
                const container = document.getElementById('particleContainer');
                if (container) {
                    container.innerHTML = '';
                }
                
                // Reset toggle button
                const toggle = document.getElementById('particleToggle');
                if (toggle) {
                    toggle.classList.remove('active');
                }
                
                this.isActive = false;
            }
            
            setupEvents() {
                console.log('Setting up particle events...');
                
                // Remove any existing event listeners first
                if (this.toggle) {
                    // Clone node to remove all event listeners
                    const newToggle = this.toggle.cloneNode(true);
                    this.toggle.parentNode.replaceChild(newToggle, this.toggle);
                    this.toggle = newToggle;
                    
                    // Add new event listener
                    this.toggle.addEventListener('click', () => {
                        console.log('Particle toggle clicked, current state:', this.isActive);

                // Create event handlers
                this.mouseEventHandler = (e) => {
                    if (this.isActive) {

                        this.mouseY = e.clientY;

                        // Create particles only if mouse is moving and enough time has passed
                        if (currentTime - this.lastMouseTime > 50) {

                            this.lastMouseTime = currentTime;
                        }
                    }
                };
                
                this.clickEventHandler = (e) => {

                        console.log('Click detected, creating burst at:', e.clientX, e.clientY);
                        this.createBurst(e.clientX, e.clientY);
                    }

                // Add event listeners
                document.addEventListener('mousemove', this.mouseEventHandler);
                document.addEventListener('click', this.clickEventHandler);
                
                console.log('Particle events set up successfully');

            loadSavedState() {
                console.log('Loading particle saved state...');
                
                const savedState = localStorage.getItem('particleAnimation');
                console.log('Particle saved state:', savedState);

                if (savedState === null || savedState === 'true') {

                    setTimeout(() => {

                    console.log('Particle animation disabled by saved state');

                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random size
                const size = Math.random() * 8 + 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';

                let color;

                        'rgba(147, 51, 234, 0.6)',
                        'rgba(236, 72, 153, 0.6)',

                this.particles.push(particle);

                        const index = this.particles.indexOf(particle);
                        if (index > -1) {

                const trail = document.createElement('div');
                trail.className = 'mouse-trail';

                trail.style.top = y + 'px';

                // Remove after animation
                setTimeout(() => {
                    if (trail && trail.parentNode) {
                        trail.parentNode.removeChild(trail);
                    }
                }, 1000);
            }
            
            createBurst(x, y) {
                // Create multiple particles in a burst pattern
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        const angle = (i / 8) * Math.PI * 2;
                        const distance = Math.random() * 50 + 20;
                        const burstX = x + Math.cos(angle) * distance;
                        const burstY = y + Math.sin(angle) * distance;

                }
            }

                // Ensure we have the container

                    this.toggle.classList.add('active');
                }
                
                // Save state
                localStorage.setItem('particleAnimation', 'true');
                console.log('Particle animation fully started');
            }
            
            stop() {
                this.isActive = false;
                
                if (this.toggle) {
                    this.toggle.classList.remove('active');
                }
                
                // Clear all particles
                this.particles.forEach(particle => {

                            // Element might already be removed

                if (this.initialized) {
                    localStorage.setItem('particleAnimation', 'false');

        }
