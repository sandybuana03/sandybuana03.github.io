<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer - SMK AL-IRSYAD TEGAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'islamic-green': {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .glow-effect {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .file-item:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        
        .search-glow:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1), 0 0 20px rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen transition-all duration-300">
    <!-- Header -->
    <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-islamic-green-200 dark:border-islamic-green-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-islamic-green-500 to-islamic-green-600 rounded-xl flex items-center justify-center glow-effect">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">File Explorer</h1>
                        <p class="text-sm text-islamic-green-600 dark:text-islamic-green-400 font-medium">SMK AL-IRSYAD TEGAL</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Search Box -->
                    <div class="relative">
                        <input 
                            type="text" 
                            id="searchInput"
                            placeholder="Cari file atau folder..."
                            class="w-64 sm:w-80 px-4 py-2 pl-10 bg-white dark:bg-gray-700 border border-islamic-green-200 dark:border-islamic-green-700 rounded-xl focus:outline-none search-glow text-gray-900 dark:text-white text-base"
                        >
                        <svg class="w-5 h-5 text-islamic-green-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    
                    <!-- Dark Mode Toggle -->
                    <button 
                        id="darkModeToggle"
                        class="p-2 bg-islamic-green-100 dark:bg-islamic-green-800 text-islamic-green-600 dark:text-islamic-green-300 rounded-xl hover:bg-islamic-green-200 dark:hover:bg-islamic-green-700 transition-all duration-300"
                    >
                        <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Breadcrumb Navigation -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex items-center space-x-2 mb-6 text-lg">
            <button id="homeBtn" class="flex items-center space-x-2 px-4 py-2 bg-islamic-green-100 dark:bg-islamic-green-800 text-islamic-green-700 dark:text-islamic-green-300 rounded-lg hover:bg-islamic-green-200 dark:hover:bg-islamic-green-700 transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <span>Root</span>
            </button>
            <span id="breadcrumbPath" class="text-gray-500 dark:text-gray-400"></span>
        </div>

        <!-- File List Header -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-islamic-green-100 dark:border-islamic-green-800 overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-6 bg-islamic-green-50 dark:bg-islamic-green-900/20 border-b border-islamic-green-200 dark:border-islamic-green-700">
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg">Nama File</div>
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg hidden md:block">Jurusan</div>
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg hidden md:block">Kelas</div>
            </div>

            <!-- File List -->
            <div id="fileList" class="divide-y divide-gray-200 dark:divide-gray-700">
                <!-- Files will be populated here by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // File structure configuration - Update this with your actual files and folders
        const fileStructure = {
            '.': {
                folders: ['Basis Data', 'Informatika', 'Mapil - Pemrograman Web', 'PKL - Prakerin'],
                files: []
            },
            
            'Basis Data': {
                jurusan: 'Rekayasa Perangkat Lunak',  // Atur jurusan di sini
                kelas: 'XII RPL 1',                    // Atur kelas di sini
                folders: [],
                files: [
                    { name: 'logo.png', displayName: 'Logo Sekolah', size: 45678, modified: Date.now() / 1000 - 259200 },
                    { name: 'banner.jpg', displayName: 'Banner Basis Data', size: 123456, modified: Date.now() / 1000 - 345600 }
                ]
            },

            'Informatika': {
                jurusan: 'Teknik Komputer Jaringan',   // Atur jurusan di sini
                kelas: 'XII TKJ 2',                    // Atur kelas di sini
                folders: [],
                files: [
                    { name: 'logo.png', size: 45678, modified: Date.now() / 1000 - 259200 },
                    { name: 'banner.jpg', size: 123456, modified: Date.now() / 1000 - 345600 }
                ]
            },

            'Mapil - Pemrograman Web': {
                jurusan: 'Rekayasa Perangkat Lunak',   // Atur jurusan di sini
                kelas: 'XII RPL 2',                    // Atur kelas di sini
                folders: [],
                files: [
                    { name: '01_webtutor.html', displayName: '01 Tutorial Web', size: 45678, modified: Date.now() / 1000 - 259200 },
                    { name: '02_adminpanel.html', displayName: '02 Admin Panel', size: 123456, modified: Date.now() / 1000 - 345600 },
                    { name: '03_backend.html', displayName: '03 Backend Development', size: 123456, modified: Date.now() / 1000 - 345600 }
                ]
            },

            'PKL - Prakerin': {
                jurusan: 'Semua Jurusan',              // Atur jurusan di sini
                kelas: 'XII',                          // Atur kelas di sini
                folders: [],
                files: [
                    { name: 'Pedoman_Sistematika_Penulisan_Laporan.doc', displayName: 'Pedoman Sistematika Penulisan Laporan', size: 45678, modified: Date.now() / 1000 - 259200 },
                    { name: '1.Cover.doc', displayName: '1. Cover Laporan PKL', size: 123456, modified: Date.now() / 1000 - 345600 },
                    { name: '2.Pengesahan.doc', displayName: '2. Lembar Pengesahan', size: 123456, modified: Date.now() / 1000 - 345600 },
                    { name: '3.ISI.doc', displayName: '3. Isi Laporan PKL', size: 123456, modified: Date.now() / 1000 - 345600 },
                    { name: '4.Lampiran.doc', displayName: '4. Lampiran Dokumentasi', size: 123456, modified: Date.now() / 1000 - 345600 }
                ]
            }
        };

        // Get file extension and icon
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = {
                'html': '🌐',
                'css': '🎨',
                'js': '⚡',
                'json': '📋',
                'md': '📝',
                'txt': '📄',
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'xls': '📗',
                'xlsx': '📗',
                'ppt': '📙',
                'pptx': '📙',
                'zip': '📦',
                'rar': '📦',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'svg': '🖼️',
                'mp4': '🎬',
                'avi': '🎬',
                'mp3': '🎵',
                'wav': '🎵'
            };
            return iconMap[ext] || '📄';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Get file type description
        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const typeMap = {
                'html': 'HTML Document',
                'css': 'CSS Stylesheet',
                'js': 'JavaScript File',
                'json': 'JSON Data',
                'md': 'Markdown File',
                'txt': 'Text File',
                'pdf': 'PDF Document',
                'doc': 'Word Document',
                'docx': 'Word Document',
                'xls': 'Excel Spreadsheet',
                'xlsx': 'Excel Spreadsheet',
                'ppt': 'PowerPoint Presentation',
                'pptx': 'PowerPoint Presentation',
                'zip': 'ZIP Archive',
                'rar': 'RAR Archive',
                'jpg': 'JPEG Image',
                'jpeg': 'JPEG Image',
                'png': 'PNG Image',
                'gif': 'GIF Image',
                'svg': 'SVG Image',
                'mp4': 'MP4 Video',
                'avi': 'AVI Video',
                'mp3': 'MP3 Audio',
                'wav': 'WAV Audio'
            };
            return typeMap[ext] || 'Unknown File';
        }

        // Current directory state
        let currentDirectory = '.';

        // Update breadcrumb
        function updateBreadcrumb() {
            const breadcrumbPath = document.getElementById('breadcrumbPath');
            if (currentDirectory === '.') {
                breadcrumbPath.innerHTML = '';
            } else {
                breadcrumbPath.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        <span class="font-medium text-islamic-green-600 dark:text-islamic-green-400">${currentDirectory}</span>
                    </div>
                `;
            }
        }

        // Navigate to directory
        function navigateToDirectory(dirName) {
            currentDirectory = dirName;
            updateBreadcrumb();
            renderFiles();
        }

        // Render files and folders
        function renderFiles(searchTerm = '') {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            const currentFolder = fileStructure[currentDirectory];
            if (!currentFolder) return;

            // Show folders first
            if (currentDirectory === '.') {
                currentFolder.folders.forEach(folderName => {
                    if (searchTerm && !folderName.toLowerCase().includes(searchTerm.toLowerCase())) return;

                    const folderItem = document.createElement('div');
                    folderItem.className = 'file-item p-6 hover:bg-islamic-green-50 dark:hover:bg-islamic-green-900/10 transition-all duration-300 animate-fade-in cursor-pointer';
                    folderItem.onclick = () => navigateToDirectory(folderName);
                    
                    folderItem.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                            <div class="flex items-center space-x-4">
                                <div class="text-3xl">📁</div>
                                <div>
                                    <div class="font-semibold text-gray-900 dark:text-white text-lg">${folderName}</div>
                                    <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                        Folder • ${fileStructure[folderName]?.files?.length || 0} file(s)
                                    </div>
                                </div>
                            </div>
                            <div class="text-islamic-green-600 dark:text-islamic-green-400 font-medium text-base md:block hidden">
                                ${fileStructure[folderName]?.jurusan || 'Tidak diatur'}
                            </div>
                            <div class="text-gray-600 dark:text-gray-300 font-medium text-base md:block hidden">
                                ${fileStructure[folderName]?.kelas || 'Tidak diatur'}
                            </div>
                        </div>
                    `;
                    
                    fileList.appendChild(folderItem);
                });
            }

            // Show files
            currentFolder.files.forEach(file => {
                if (searchTerm && !file.name.toLowerCase().includes(searchTerm.toLowerCase()) && !(file.displayName && file.displayName.toLowerCase().includes(searchTerm.toLowerCase()))) return;

                const fileItem = document.createElement('div');
                fileItem.className = 'file-item p-6 hover:bg-islamic-green-50 dark:hover:bg-islamic-green-900/10 transition-all duration-300 animate-fade-in';
                
                fileItem.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                        <div class="flex items-center space-x-4">
                            <div class="text-3xl">${getFileIcon(file.name)}</div>
                            <div>
                                <div class="font-semibold text-gray-900 dark:text-white text-lg">${file.displayName || file.name}</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                    ${getFileType(file.name)} • ${formatFileSize(file.size)}
                                </div>
                            </div>
                        </div>
                        <div class="text-islamic-green-600 dark:text-islamic-green-400 font-medium text-base md:block hidden">
                            ${currentFolder.jurusan || 'Tidak diatur'}
                        </div>
                        <div class="text-gray-600 dark:text-gray-300 font-medium text-base md:block hidden">
                            ${currentFolder.kelas || 'Tidak diatur'}
                        </div>
                    </div>
                `;
                
                fileList.appendChild(fileItem);
            });

            if (fileList.children.length === 0) {
                fileList.innerHTML = `
                    <div class="p-12 text-center">
                        <div class="text-6xl mb-4">📁</div>
                        <div class="text-xl text-gray-500 dark:text-gray-400">Tidak ada file ditemukan</div>
                    </div>
                `;
            }
        }

        // Dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;

        darkModeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('darkMode', html.classList.contains('dark'));
        });

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            html.classList.add('dark');
        }

        // Home button navigation
        const homeBtn = document.getElementById('homeBtn');
        homeBtn.addEventListener('click', () => {
            currentDirectory = '.';
            updateBreadcrumb();
            renderFiles();
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            renderFiles(e.target.value);
        });

        // Initial render
        renderFiles();
    </script>

</html>
