<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buana Explorer - SMK AL-IRSYAD TEGAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'islamic-green': {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .glow-effect {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .file-item:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        
        .search-glow:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1), 0 0 20px rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen transition-all duration-300">
    <!-- Header with Integrated Breadcrumb -->
    <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-islamic-green-200 dark:border-islamic-green-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-islamic-green-500 to-islamic-green-600 rounded-xl flex items-center justify-center glow-effect">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Buana Explorer</h1>
                        <p class="text-sm text-islamic-green-600 dark:text-islamic-green-400 font-medium">SMK AL-IRSYAD TEGAL</p>
                    </div>
                </div>
                
                <!-- Dark Mode Toggle -->
                <button 
                    id="darkModeToggle"
                    class="p-2 bg-islamic-green-100 dark:bg-islamic-green-800 text-islamic-green-600 dark:text-islamic-green-300 rounded-xl hover:bg-islamic-green-200 dark:hover:bg-islamic-green-700 transition-all duration-300"
                >
                    <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Search Box -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-2">
            <div class="relative max-w-md mx-auto">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Cari file atau folder..."
                    class="w-full px-4 py-3 pl-12 pr-12 bg-white dark:bg-gray-700 border border-islamic-green-200 dark:border-islamic-green-700 rounded-xl focus:outline-none search-glow text-gray-900 dark:text-white text-base shadow-sm"
                >
                <svg class="w-5 h-5 text-islamic-green-500 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <button 
                    id="clearSearchBtn"
                    class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors duration-200 hidden"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Breadcrumb Navigation - Integrated in Header -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 border-t border-islamic-green-100 dark:border-islamic-green-700">
            <div class="flex items-center space-x-2 text-base sm:text-lg">
                <button id="homeBtn" class="flex items-center space-x-2 px-3 sm:px-4 py-2 bg-islamic-green-100 dark:bg-islamic-green-800 text-islamic-green-700 dark:text-islamic-green-300 rounded-lg hover:bg-islamic-green-200 dark:hover:bg-islamic-green-700 transition-all duration-300">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    </svg>
                    <span class="text-sm sm:text-base">Root</span>
                </button>
                <span id="breadcrumbPath" class="text-gray-500 dark:text-gray-400 text-sm sm:text-base"></span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
        <!-- File List Header -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-islamic-green-100 dark:border-islamic-green-800 overflow-hidden">
            <!-- Desktop Header -->
            <div class="hidden md:grid md:grid-cols-3 gap-4 p-6 bg-islamic-green-50 dark:bg-islamic-green-900/20 border-b border-islamic-green-200 dark:border-islamic-green-700">
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg">Nama File</div>
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg">Jurusan</div>
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg">Kelas</div>
            </div>
            
            <!-- Mobile Header -->
            <div class="md:hidden p-4 bg-islamic-green-50 dark:bg-islamic-green-900/20 border-b border-islamic-green-200 dark:border-islamic-green-700">
                <div class="font-semibold text-islamic-green-800 dark:text-islamic-green-200 text-lg">File & Folder</div>
            </div>

            <!-- File List -->
            <div id="fileList" class="divide-y divide-gray-200 dark:divide-gray-700">
                <!-- Files will be populated here by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // File structure configuration - Update this with your actual files and folders
        const fileStructure = {
            '.': {
                folders: ['Basis Data', 'Informatika', 'Mapil - Pemrograman Web', 'PKL - Prakerin'],
                files: []
            },
            
            'Basis Data': {
                jurusan: 'Rekayasa Perangkat Lunak',  // Atur jurusan di sini
                kelas: 'XII RPL 1',                    // Atur kelas di sini
                folders: [],
                files: [
                    { name: 'logo.png', displayName: 'Logo Sekolah', size: null, modified: Date.now() / 1000 - 259200 },
                    { name: 'banner.jpg', displayName: 'Banner Basis Data', size: null, modified: Date.now() / 1000 - 345600 }
                ]
            },

            'Informatika': {
                jurusan: 'Teknik Komputer Jaringan',   // Atur jurusan di sini
                kelas: 'XII TKJ 2',                    // Atur kelas di sini
                folders: [],
                files: [
                    { name: 'logo.png', size: null, modified: Date.now() / 1000 - 259200 },
                    { name: 'banner.jpg', size: null, modified: Date.now() / 1000 - 345600 }
                ]
            },

            'Mapil - Pemrograman Web': {
                jurusan: 'Rekayasa Perangkat Lunak',   // Atur jurusan di sini
                kelas: 'XII RPL 2',                    // Atur kelas di sini
                folders: [],
                files: [
                    { name: '01_webtutor.html', displayName: '01 Tutorial Web', size: null, modified: Date.now() / 1000 - 259200 },
                    { name: '02_adminpanel.html', displayName: '02 Admin Panel', size: null, modified: Date.now() / 1000 - 345600 },
                    { name: '03_backend.html', displayName: '03 Backend Development', size: null, modified: Date.now() / 1000 - 345600 }
                ]
            },

            'PKL - Prakerin': {
                jurusan: 'Semua Jurusan',              // Atur jurusan di sini
                kelas: 'XII',                          // Atur kelas di sini
                folders: [],
                files: [
                    { name: 'Pedoman_Sistematika_Penulisan_Laporan.doc', displayName: 'Pedoman Sistematika Penulisan Laporan', size: null, modified: Date.now() / 1000 - 259200 },
                    { name: '1.Cover.doc', displayName: '1. Cover Laporan PKL', size: null, modified: Date.now() / 1000 - 345600 },
                    { name: '2.Pengesahan.doc', displayName: '2. Lembar Pengesahan', size: null, modified: Date.now() / 1000 - 345600 },
                    { name: '3.ISI.doc', displayName: '3. Isi Laporan PKL', size: null, modified: Date.now() / 1000 - 345600 },
                    { name: '4.Lampiran.doc', displayName: '4. Lampiran Dokumentasi', size: null, modified: Date.now() / 1000 - 345600 }
                ]
            }
        };

        // Cache untuk menyimpan ukuran file yang sudah dideteksi
        const fileSizeCache = new Map();

        // Fungsi untuk mendeteksi ukuran file secara otomatis
        async function detectFileSize(filePath) {
            // Cek cache terlebih dahulu
            if (fileSizeCache.has(filePath)) {
                return fileSizeCache.get(filePath);
            }

            try {
                const response = await fetch(filePath, { method: 'HEAD' });
                if (response.ok) {
                    const contentLength = response.headers.get('Content-Length');
                    if (contentLength) {
                        const size = parseInt(contentLength);
                        fileSizeCache.set(filePath, size);
                        return size;
                    }
                }
            } catch (error) {
                console.log(`Tidak dapat mendeteksi ukuran file: ${filePath}`);
            }

            // Fallback: coba dengan fetch biasa untuk mendapatkan ukuran
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const blob = await response.blob();
                    const size = blob.size;
                    fileSizeCache.set(filePath, size);
                    return size;
                }
            } catch (error) {
                console.log(`Fallback gagal untuk: ${filePath}`);
            }

            return null;
        }

        // Get file extension and icon
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = {
                'html': '🌐',
                'css': '🎨',
                'js': '⚡',
                'json': '📋',
                'md': '📝',
                'txt': '📄',
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'xls': '📗',
                'xlsx': '📗',
                'ppt': '📙',
                'pptx': '📙',
                'zip': '📦',
                'rar': '📦',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'svg': '🖼️',
                'mp4': '🎬',
                'avi': '🎬',
                'mp3': '🎵',
                'wav': '🎵'
            };
            return iconMap[ext] || '📄';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === null || bytes === undefined) return 'Mendeteksi...';
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Fungsi untuk memperbarui ukuran file di tampilan
        function updateFileSizeInDisplay(filePath, size, fileElement) {
            const sizeElements = fileElement.querySelectorAll('.file-size');
            sizeElements.forEach(element => {
                if (typeof size === 'string') {
                    element.textContent = size;
                } else {
                    element.textContent = formatFileSize(size);
                }
            });
        }

        // Get file type description
        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const typeMap = {
                'html': 'HTML Document',
                'css': 'CSS Stylesheet',
                'js': 'JavaScript File',
                'json': 'JSON Data',
                'md': 'Markdown File',
                'txt': 'Text File',
                'pdf': 'PDF Document',
                'doc': 'Word Document',
                'docx': 'Word Document',
                'xls': 'Excel Spreadsheet',
                'xlsx': 'Excel Spreadsheet',
                'ppt': 'PowerPoint Presentation',
                'pptx': 'PowerPoint Presentation',
                'zip': 'ZIP Archive',
                'rar': 'RAR Archive',
                'jpg': 'JPEG Image',
                'jpeg': 'JPEG Image',
                'png': 'PNG Image',
                'gif': 'GIF Image',
                'svg': 'SVG Image',
                'mp4': 'MP4 Video',
                'avi': 'AVI Video',
                'mp3': 'MP3 Audio',
                'wav': 'WAV Audio'
            };
            return typeMap[ext] || 'Unknown File';
        }

        // Current directory state
        let currentDirectory = '.';

        // Function to open file
        function openFile(filename, folder) {
            // Build the file path based on folder structure
            let filePath = '';
            
            if (folder === '.') {
                filePath = filename;
            } else {
                // Convert folder name to match your GitHub structure
                const folderMap = {
                    'Basis Data': 'Basis Data',
                    'Informatika': 'Informatika', 
                    'Mapil - Pemrograman Web': 'Mapil - Pemrograman Web',
                    'PKL - Prakerin': 'PKL - Prakerin'
                };
                
                const mappedFolder = folderMap[folder] || folder;
                filePath = `${mappedFolder}/${filename}`;
            }
            
            // Open file in new tab
            window.open(filePath, '_blank');
        }

        // Update breadcrumb
        function updateBreadcrumb() {
            const breadcrumbPath = document.getElementById('breadcrumbPath');
            if (currentDirectory === '.') {
                breadcrumbPath.innerHTML = '';
            } else {
                breadcrumbPath.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        <span class="font-medium text-islamic-green-600 dark:text-islamic-green-400">${currentDirectory}</span>
                    </div>
                `;
            }
        }

        // Navigate to directory
        function navigateToDirectory(dirName) {
            currentDirectory = dirName;
            updateBreadcrumb();
            renderFiles();
        }

        // Render files and folders
        function renderFiles(searchTerm = '') {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            // If there's a search term, search across all folders
            if (searchTerm) {
                let hasResults = false;
                
                // Search through all folders and their files
                Object.keys(fileStructure).forEach(folderKey => {
                    if (folderKey === '.') return; // Skip root
                    
                    const folder = fileStructure[folderKey];
                    folder.files.forEach(file => {
                        const fileName = file.name.toLowerCase();
                        const displayName = (file.displayName || '').toLowerCase();
                        const searchLower = searchTerm.toLowerCase();
                        
                        // Check if search term matches
                        if (fileName.includes(searchLower) || displayName.includes(searchLower)) {
                            hasResults = true;
                            
                            const fileItem = document.createElement('div');
                            fileItem.className = 'file-item p-6 hover:bg-islamic-green-50 dark:hover:bg-islamic-green-900/10 transition-all duration-300 animate-fade-in cursor-pointer';
                            fileItem.onclick = () => openFile(file.name, folderKey);
                            
                            fileItem.innerHTML = `
                                <!-- Desktop Layout -->
                                <div class="hidden md:grid md:grid-cols-3 gap-4 items-center">
                                    <div class="flex items-center space-x-4">
                                        <div class="text-3xl">${getFileIcon(file.name)}</div>
                                        <div>
                                            <div class="font-semibold text-gray-900 dark:text-white text-lg">${file.displayName || file.name}</div>
                                            <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                                ${getFileType(file.name)} • <span class="file-size">${formatFileSize(file.size)}</span> • di folder "${folderKey}"
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-islamic-green-600 dark:text-islamic-green-400 font-medium text-base">
                                        ${folder.jurusan || 'Tidak diatur'}
                                    </div>
                                    <div class="text-gray-600 dark:text-gray-300 font-medium text-base">
                                        ${folder.kelas || 'Tidak diatur'}
                                    </div>
                                </div>
                                
                                <!-- Mobile Layout -->
                                <div class="md:hidden flex items-center space-x-4">
                                    <div class="text-3xl">${getFileIcon(file.name)}</div>
                                    <div class="flex-1">
                                        <div class="font-semibold text-gray-900 dark:text-white text-lg">${file.displayName || file.name}</div>
                                        <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                            ${getFileType(file.name)} • <span class="file-size">${formatFileSize(file.size)}</span> • di folder "${folderKey}"
                                        </div>
                                        <div class="text-sm text-islamic-green-600 dark:text-islamic-green-400 mt-1">
                                            ${folder.jurusan || 'Tidak diatur'} • ${folder.kelas || 'Tidak diatur'}
                                        </div>
                                    </div>
                                </div>
                            `;
                            
                            // Deteksi ukuran file secara otomatis
                            if (file.size === null) {
                                const folderMap = {
                                    'Basis Data': 'Basis Data',
                                    'Informatika': 'Informatika', 
                                    'Mapil - Pemrograman Web': 'Mapil - Pemrograman Web',
                                    'PKL - Prakerin': 'PKL - Prakerin'
                                };
                                
                                const mappedFolder = folderMap[folderKey] || folderKey;
                                const filePath = `${mappedFolder}/${file.name}`;
                                
                                detectFileSize(filePath).then(size => {
                                    if (size !== null) {
                                        file.size = size; // Update cache
                                        updateFileSizeInDisplay(filePath, size, fileItem);
                                    } else {
                                        updateFileSizeInDisplay(filePath, 'Tidak diketahui', fileItem);
                                    }
                                });
                            }
                            
                            fileList.appendChild(fileItem);
                        }
                    });
                });
                
                if (!hasResults) {
                    fileList.innerHTML = `
                        <div class="p-12 text-center">
                            <div class="text-6xl mb-4">🔍</div>
                            <div class="text-xl text-gray-500 dark:text-gray-400 mb-2">Tidak ditemukan</div>
                            <div class="text-sm text-gray-400 dark:text-gray-500">Coba kata kunci lain untuk pencarian</div>
                        </div>
                    `;
                }
                return;
            }

            const currentFolder = fileStructure[currentDirectory];
            if (!currentFolder) return;

            // Show folders first (only when not searching)
            if (currentDirectory === '.') {
                currentFolder.folders.forEach(folderName => {

                    const folderItem = document.createElement('div');
                    folderItem.className = 'file-item p-6 hover:bg-islamic-green-50 dark:hover:bg-islamic-green-900/10 transition-all duration-300 animate-fade-in cursor-pointer';
                    folderItem.onclick = () => navigateToDirectory(folderName);
                    
                    folderItem.innerHTML = `
                        <!-- Desktop Layout -->
                        <div class="hidden md:grid md:grid-cols-3 gap-4 items-center">
                            <div class="flex items-center space-x-4">
                                <div class="text-3xl">
                                    <svg class="w-8 h-8 text-islamic-green-500" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M10 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2h-8l-2-2z"/>
                                    </svg>
                                </div>
                                <div>
                                    <div class="font-semibold text-gray-900 dark:text-white text-lg">${folderName}</div>
                                    <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                        Folder • ${fileStructure[folderName]?.files?.length || 0} file(s)
                                    </div>
                                </div>
                            </div>
                            <div class="text-islamic-green-600 dark:text-islamic-green-400 font-medium text-base">
                                ${fileStructure[folderName]?.jurusan || 'Tidak diatur'}
                            </div>
                            <div class="text-gray-600 dark:text-gray-300 font-medium text-base">
                                ${fileStructure[folderName]?.kelas || 'Tidak diatur'}
                            </div>
                        </div>
                        
                        <!-- Mobile Layout -->
                        <div class="md:hidden flex items-center space-x-4">
                            <div class="text-3xl">
                                <svg class="w-8 h-8 text-islamic-green-500" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M10 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2h-8l-2-2z"/>
                                </svg>
                            </div>
                            <div class="flex-1">
                                <div class="font-semibold text-gray-900 dark:text-white text-lg">${folderName}</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                    Folder • ${fileStructure[folderName]?.files?.length || 0} file(s)
                                </div>
                                <div class="text-sm text-islamic-green-600 dark:text-islamic-green-400 mt-1">
                                    ${fileStructure[folderName]?.jurusan || 'Tidak diatur'} • ${fileStructure[folderName]?.kelas || 'Tidak diatur'}
                                </div>
                            </div>
                        </div>
                    `;
                    
                    fileList.appendChild(folderItem);
                });
            }

            // Show files
            currentFolder.files.forEach(file => {
                // Enhanced search - check both file name and display name
                if (searchTerm) {
                    const fileName = file.name.toLowerCase();
                    const displayName = (file.displayName || '').toLowerCase();
                    const searchLower = searchTerm.toLowerCase();
                    
                    // Check if search term exists in either file name or display name
                    const matchesFileName = fileName.includes(searchLower);
                    const matchesDisplayName = displayName.includes(searchLower);
                    
                    if (!matchesFileName && !matchesDisplayName) return;
                }

                const fileItem = document.createElement('div');
                fileItem.className = 'file-item p-6 hover:bg-islamic-green-50 dark:hover:bg-islamic-green-900/10 transition-all duration-300 animate-fade-in cursor-pointer';
                
                // Add click handler to open file
                fileItem.onclick = () => openFile(file.name, currentDirectory);
                
                fileItem.innerHTML = `
                    <!-- Desktop Layout -->
                    <div class="hidden md:grid md:grid-cols-3 gap-4 items-center">
                        <div class="flex items-center space-x-4">
                            <div class="text-3xl">${getFileIcon(file.name)}</div>
                            <div>
                                <div class="font-semibold text-gray-900 dark:text-white text-lg">${file.displayName || file.name}</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                    ${getFileType(file.name)} • <span class="file-size">${formatFileSize(file.size)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-islamic-green-600 dark:text-islamic-green-400 font-medium text-base">
                            ${currentFolder.jurusan || 'Tidak diatur'}
                        </div>
                        <div class="text-gray-600 dark:text-gray-300 font-medium text-base">
                            ${currentFolder.kelas || 'Tidak diatur'}
                        </div>
                    </div>
                    
                    <!-- Mobile Layout -->
                    <div class="md:hidden flex items-center space-x-4">
                        <div class="text-3xl">${getFileIcon(file.name)}</div>
                        <div class="flex-1">
                            <div class="font-semibold text-gray-900 dark:text-white text-lg">${file.displayName || file.name}</div>
                            <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                ${getFileType(file.name)} • <span class="file-size">${formatFileSize(file.size)}</span>
                            </div>
                            <div class="text-sm text-islamic-green-600 dark:text-islamic-green-400 mt-1">
                                ${currentFolder.jurusan || 'Tidak diatur'} • ${currentFolder.kelas || 'Tidak diatur'}
                            </div>
                        </div>
                    </div>
                `;
                
                // Deteksi ukuran file secara otomatis
                if (file.size === null) {
                    const folderMap = {
                        'Basis Data': 'Basis Data',
                        'Informatika': 'Informatika', 
                        'Mapil - Pemrograman Web': 'Mapil - Pemrograman Web',
                        'PKL - Prakerin': 'PKL - Prakerin'
                    };
                    
                    const mappedFolder = folderMap[currentDirectory] || currentDirectory;
                    const filePath = currentDirectory === '.' ? file.name : `${mappedFolder}/${file.name}`;
                    
                    detectFileSize(filePath).then(size => {
                        if (size !== null) {
                            file.size = size; // Update cache
                            updateFileSizeInDisplay(filePath, size, fileItem);
                        } else {
                            updateFileSizeInDisplay(filePath, 'Tidak diketahui', fileItem);

                    });
                }
                
                fileList.appendChild(fileItem);
            });

            if (fileList.children.length === 0) {
                fileList.innerHTML = `
                    <div class="p-12 text-center">
                        <div class="text-6xl mb-4">📁</div>
                        <div class="text-xl text-gray-500 dark:text-gray-400">Tidak ada file ditemukan</div>
                    </div>
                `;
            }
        }

        // Dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;

        darkModeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('darkMode', html.classList.contains('dark'));
        });

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            html.classList.add('dark');
        }

        // Home button navigation
        const homeBtn = document.getElementById('homeBtn');
        homeBtn.addEventListener('click', () => {
            currentDirectory = '.';
            updateBreadcrumb();
            renderFiles();
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        
        searchInput.addEventListener('input', (e) => {
            const value = e.target.value;
            renderFiles(value);
            
            // Show/hide clear button
            if (value.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
        });
        
        // Clear search functionality
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderFiles('');
            searchInput.focus();
        });

        // Initial render
        renderFiles();
    </script>
